<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink:        #3a3531;
    --line:       #c7a98a;
    --root-bg:    #BF826F;
    --root-ink:   #ffffff;
    --branch-bg:  #D1B397;
    --branch-ink: #3a3531;
    --leaf-ink:   #4a443f;
    --header-ink: #B8B8B8;
    --rule:       #B8B8B8;
    --page:       #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--page);
  }
  .page {
    position: relative;
    width: 794px;
    min-height: 1123px;
    padding: 48px 52px 44px;
    background: var(--page);
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: var(--header-ink);
    letter-spacing: 1px;
    padding-bottom: 9px;
    border-bottom: 1.5px solid var(--rule);
    flex: 0 0 auto;
  }
  .doc-title {
    position: absolute;
    top: 112px; left: 0; right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2px;
    z-index: 3;
  }
  /* 导图区吃满页眉以下全部高度,导图作为紧凑块在其中垂直居中 */
  /* padding-top 把导图块压到标题下方,避免内容少时上飘贴住标题 */
  .map {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding-top: 72px;
  }
  .svg-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .nodes-layer {
    position: relative; z-index: 2;
    width: 100%;
    display: grid;
    grid-template-columns: 132px 1fr;   /* 中心列 | 右侧分支区 */
    align-items: center;
    column-gap: 40px;
  }
  .root-col { display: flex; align-items: center; justify-content: center; }
  .root {
    background: var(--root-bg);
    color: var(--root-ink);
    border-radius: 16px;
    padding: 18px 16px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    width: 142px;
    box-shadow: 0 2px 7px rgba(150,110,80,.18);
  }
  /* 右侧分支区:每个分支一行,纵向按内容自然高度堆叠 */
  .branch-area {
    display: flex; flex-direction: column;
    gap: 20px;                  /* 分支之间的固定间距 */
  }
  /* 一行 = [分支节点 | 子组],分支垂直居中对齐到子组中线 */
  .branch-row {
    display: grid;
    grid-template-columns: 104px 1fr;
    align-items: center;
    column-gap: 36px;
  }
  .branch {
    background: var(--branch-bg);
    color: var(--branch-ink);
    border-radius: 9px;
    padding: 9px 4px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
  }
  .branch-group {
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .l2-row { display: flex; align-items: center; }
  .l2 {
    font-size: 12.5px; font-weight: 600;
    color: var(--leaf-ink); line-height: 1.45;
    padding: 2px 0 2px 6px; max-width: 360px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .l3-col {
    display: flex; flex-direction: column;
    justify-content: center; gap: 6px;
    margin-left: 34px;   /* 二级→三级跨度 */
  }
  .l3 {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 1px 0 1px 6px;
    max-width: 320px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .leaf {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 2px 0 2px 6px;
    max-width: 360px;
    overflow-wrap: break-word; word-break: break-word;
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="header">
    <span id="hL"></span>
    <span id="hR"></span>
  </div>
  <div class="doc-title" id="docTitle"></div>
  <div class="map" id="map">
    <svg class="svg-layer" id="svg"></svg>
    <div class="nodes-layer" id="nodes"></div>
  </div>
</div>
<script>
  const DATA = {"title": "《亲爱的汉修先生》教学思维导图", "header_left": "老约翰深度阅读", "header_right": "阅读 · 思辨 · 表达", "branches": [{"name": "教学目标", "children": [{"label": "知识与技能：认识书信体与日记体，理清鲍雷伊六年级这一年的时间线、成长脉络与人物关系。"}, {"label": "过程与方法：综合运用预测、提问、推断、比较等策略，借助可视化工具做梳理、对照、细读与思辨。"}, {"label": "情感态度价值观：体会普通孩子面对真实难处仍找到自己，懂得写真实经历、做真实自己的分量。"}]}, {"name": "教学流程", "children": [{"label": "第一课时：导读课", "children": [{"label": "导入·一个男孩的「作家梦」"}, {"label": "先睹为快·精读一则日记一封信"}, {"label": "预测阅读单·猜六年级这段时间的事"}, {"label": "读法小结·布置七天阅读计划"}]}, {"label": "第二课时：阅读交流课1", "children": [{"label": "开场·回看预测阅读单"}, {"label": "内容梳理·全书理成三段"}, {"label": "人物关系图·鲍雷伊身边的人"}, {"label": "解谜·为什么写给「假」汉修先生"}]}, {"label": "第三课时：阅读交流课2", "children": [{"label": "开场·两副笔墨"}, {"label": "细读·日记与信里的心里话"}, {"label": "对比图·两副笔墨"}, {"label": "作品写法·两条线一起写好在哪"}]}, {"label": "第四课时：思辨&应用课", "children": [{"label": "深度阅读发现·成长阶梯图"}, {"label": "思辨阅读单·三道没有标准答案的题"}, {"label": "联系生活·烦心事从正面想一想"}, {"label": "应用·给鲍雷伊写一封回信"}]}]}, {"name": "重点教学环节", "children": [{"label": "先睹为快：导读课当堂精读一则日记、一封信，先尝到这本书的滋味再开读。"}, {"label": "人物关系图：理清鲍雷伊身边的人，分清汉修先生与安琪拉·贝乔两位作家。"}, {"label": "对比图·两副笔墨：把「信」与「日记」逐项对照，看清最疼的话藏在日记里。"}, {"label": "成长阶梯图：把八个成长转折点排成台阶，看清他这一年怎么一步步长大。"}, {"label": "思辨三题：聊三道没有标准答案的题（含「汉修是不是好老师」），先听证据再说话。"}]}, {"name": "阅读策略学习", "children": [{"label": "预测：读前用预测阅读单猜六年级这段时间会发生的事，读后回看验证。"}, {"label": "筛选重要信息：把全书理成「起因—困境—转变」三段，挑出每段最要紧的事。"}, {"label": "推断：细读日记与信，从写下的字句推断他没直说的心情。"}, {"label": "比较：用对比图比清「信」与「日记」两副笔墨的不同。"}, {"label": "转化：给鲍雷伊写一封回信，把一年的陪伴与体会郑重还给他。"}]}, {"name": "可视化工具的运用", "children": [{"label": "预测阅读单：读前记下预测，交流课开场回看对照。"}, {"label": "人物关系图：梳理鲍雷伊身边的家人、同学与两位作家。"}, {"label": "对比图：逐项对照「信」与「日记」两副笔墨的差别。"}, {"label": "成长阶梯图：把八个转折点排成一级级成长的台阶。"}, {"label": "思辨阅读单：承载三道思辨题，记下观点与文本依据。"}]}]};
  const GAP = 6;        // 弧线端点与节点的水平间隙
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render(data) {
    document.getElementById('hL').textContent = data.header_left || '';
    document.getElementById('hR').textContent = data.header_right || '';
    document.getElementById('docTitle').textContent = data.title || '';
    const nodes = document.getElementById('nodes');
    nodes.innerHTML = '';
    const rootCol = el('div', 'root-col');
    const root = el('div', 'root', data.title);
    root.id = 'node-root';
    rootCol.appendChild(root);
    nodes.appendChild(rootCol);

    const area = el('div', 'branch-area');
    data.branches.forEach((br, bi) => {
      const rowEl = el('div', 'branch-row');
      const b = el('div', 'branch', br.name);
      b.id = 'branch-' + bi;
      rowEl.appendChild(b);

      const group = el('div', 'branch-group');
      group.id = 'group-' + bi;
      (br.children || []).forEach((c2, ci) => {
        const row = el('div', 'l2-row');
        const lbl = el('div', c2.children ? 'l2' : 'leaf', c2.label);
        lbl.id = `n-${bi}-${ci}`;
        row.appendChild(lbl);
        if (c2.children) {
          const l3col = el('div', 'l3-col');
          c2.children.forEach((c3, ti) => {
            const t = el('div', 'l3', c3.label);
            t.id = `n-${bi}-${ci}-${ti}`;
            l3col.appendChild(t);
          });
          row.appendChild(l3col);
        }
        group.appendChild(row);
      });
      rowEl.appendChild(group);
      area.appendChild(rowEl);
    });
    nodes.appendChild(area);
    requestAnimationFrame(drawLines);
  }
  function box(id) {
    const map = document.getElementById('map').getBoundingClientRect();
    const r = document.getElementById(id).getBoundingClientRect();
    return {
      leftX:  r.left - map.left,
      rightX: r.right - map.left,
      midY:   r.top - map.top + r.height / 2
    };
  }
  // 舒展大弧:水平方向用较大的控制点偏移,弧度更圆润
  function curve(x1, y1, x2, y2, spread) {
    spread = spread == null ? 0.6 : spread;
    const dx = (x2 - x1) * spread;
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }
  function mkpath(d, w) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line').trim());
    p.setAttribute('stroke-width', w || '1.6');
    p.setAttribute('stroke-linecap', 'round');
    return p;
  }
  function drawLines() {
    const svg = document.getElementById('svg');
    const map = document.getElementById('map').getBoundingClientRect();
    svg.setAttribute('width', map.width);
    svg.setAttribute('height', map.height);
    svg.setAttribute('viewBox', `0 0 ${map.width} ${map.height}`);
    svg.innerHTML = '';

    const rootB = box('node-root');
    // 主干竖线的 x 位置:中心节点右缘与分支左缘之间约 40%
    const branch0 = box('branch-0');
    const trunkX = rootB.rightX + (branch0.leftX - rootB.rightX) * 0.42;

    // 计算各分支竖向范围,画主干竖线
    const brBoxes = DATA.branches.map((_, bi) => box('branch-' + bi));
    const topY = brBoxes[0].midY;
    const botY = brBoxes[brBoxes.length - 1].midY;

    // 1) 中心节点 -> 主干:一条短弧从中心右缘接到主干中点
    const trunkMidY = (topY + botY) / 2;
    svg.appendChild(mkpath(curve(rootB.rightX + GAP, rootB.midY, trunkX, trunkMidY, 0.7)));
    // 2) 主干竖线(两端略微内收,后面用弧接到首末分支,形成自然收尾)
    const cap = 10;
    svg.appendChild(mkpath(`M ${trunkX} ${topY} L ${trunkX} ${botY}`, '1.6'));
    // 3) 主干 -> 各分支:从主干对应高度分出小弧接入分支左缘
    DATA.branches.forEach((br, bi) => {
      const brB = brBoxes[bi];
      svg.appendChild(mkpath(curve(trunkX, brB.midY, brB.leftX - GAP, brB.midY, 0.55)));

      // 4) 分支 -> 子节点:舒展大弧分叉(spread 越大越舒展)
      (br.children || []).forEach((c2, ci) => {
        const n2 = box(`n-${bi}-${ci}`);
        svg.appendChild(mkpath(curve(brB.rightX + GAP, brB.midY, n2.leftX - GAP, n2.midY, 0.75)));
        if (c2.children) {
          c2.children.forEach((c3, ti) => {
            const n3 = box(`n-${bi}-${ci}-${ti}`);
            svg.appendChild(mkpath(curve(n2.rightX + GAP, n2.midY, n3.leftX - GAP, n3.midY, 0.75)));
          });
        }
      });
    });
    document.body.setAttribute('data-rendered', '1');
  }
  if (DATA) render(DATA);
</script>
</body>
</html>
