<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink:        #3a3531;
    --line:       #c7a98a;
    --root-bg:    #BF826F;
    --root-ink:   #ffffff;
    --branch-bg:  #D1B397;
    --branch-ink: #3a3531;
    --leaf-ink:   #4a443f;
    --header-ink: #B8B8B8;
    --rule:       #B8B8B8;
    --page:       #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--page);
  }
  .page {
    position: relative;
    width: 794px;
    min-height: 1123px;
    padding: 48px 52px 44px;
    background: var(--page);
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: var(--header-ink);
    letter-spacing: 1px;
    padding-bottom: 9px;
    border-bottom: 1.5px solid var(--rule);
    flex: 0 0 auto;
  }
  .doc-title {
    position: absolute;
    top: 112px; left: 0; right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2px;
    z-index: 3;
  }
  /* 导图区吃满页眉以下全部高度,导图作为紧凑块在其中垂直居中 */
  /* padding-top 把导图块压到标题下方,避免内容少时上飘贴住标题 */
  .map {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding-top: 72px;
  }
  .svg-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .nodes-layer {
    position: relative; z-index: 2;
    width: 100%;
    display: grid;
    grid-template-columns: 132px 1fr;   /* 中心列 | 右侧分支区 */
    align-items: center;
    column-gap: 40px;
  }
  .root-col { display: flex; align-items: center; justify-content: center; }
  .root {
    background: var(--root-bg);
    color: var(--root-ink);
    border-radius: 16px;
    padding: 18px 16px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    width: 142px;
    box-shadow: 0 2px 7px rgba(150,110,80,.18);
  }
  /* 右侧分支区:每个分支一行,纵向按内容自然高度堆叠 */
  .branch-area {
    display: flex; flex-direction: column;
    gap: 20px;                  /* 分支之间的固定间距 */
  }
  /* 一行 = [分支节点 | 子组],分支垂直居中对齐到子组中线 */
  .branch-row {
    display: grid;
    grid-template-columns: 104px 1fr;
    align-items: center;
    column-gap: 36px;
  }
  .branch {
    background: var(--branch-bg);
    color: var(--branch-ink);
    border-radius: 9px;
    padding: 9px 4px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
  }
  .branch-group {
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .l2-row { display: flex; align-items: center; }
  .l2 {
    font-size: 12.5px; font-weight: 600;
    color: var(--leaf-ink); line-height: 1.45;
    padding: 2px 0 2px 6px; max-width: 360px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .l3-col {
    display: flex; flex-direction: column;
    justify-content: center; gap: 6px;
    margin-left: 34px;   /* 二级→三级跨度 */
  }
  .l3 {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 1px 0 1px 6px;
    max-width: 320px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .leaf {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 2px 0 2px 6px;
    max-width: 360px;
    overflow-wrap: break-word; word-break: break-word;
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="header">
    <span id="hL"></span>
    <span id="hR"></span>
  </div>
  <div class="doc-title" id="docTitle"></div>
  <div class="map" id="map">
    <svg class="svg-layer" id="svg"></svg>
    <div class="nodes-layer" id="nodes"></div>
  </div>
</div>
<script>
  const DATA = {"title": "《格列佛游记》教学思维导图", "header_left": "老约翰深度阅读", "header_right": "阅读 · 思辨 · 表达", "branches": [{"name": "教学目标", "children": [{"label": "知识与技能：了解斯威夫特及其讽刺风格，把握四卷结构与情节人物，理解“讽刺”的工作方式。"}, {"label": "过程与方法：综合运用提问、推断、比较、整合等策略，用对比表、维恩图、阶梯图梳理跨卷信息。"}, {"label": "情感态度价值观：思考人性、理性与兽性、权力与战争，学以“外来者视角”反观自身，养成批判性思考。"}]}, {"name": "教学流程", "children": [{"label": "第一课时：导读课", "children": [{"label": "话题激趣·导入课堂"}, {"label": "走近作者·了解作品"}, {"label": "精读卷一开篇·先睹为快"}, {"label": "阅读建议与计划布置"}]}, {"label": "第二课时：阅读交流课（一）", "children": [{"label": "感受分享·回顾全书"}, {"label": "四卷情节梳理·思维导图归并"}, {"label": "对比表·小人国↔大人国"}, {"label": "讽刺逻辑图·钻进荒诞片段"}, {"label": "小结·预告下一节"}]}, {"label": "第三课时：阅读交流课（二）", "children": [{"label": "导入“慧骃与野胡”"}, {"label": "推断作者意图·从重复事物出发"}, {"label": "阶梯图·态度变化阶梯"}, {"label": "小结·预告思辨课"}]}, {"label": "第四课时：思辨&应用课", "children": [{"label": "趣味表达·导入思辨"}, {"label": "两难思辨阅读单"}, {"label": "应用创作·第五次航行"}, {"label": "课堂总结"}]}]}, {"name": "重点教学环节", "children": [{"label": "对比表·小人国↔大人国：只抓体型比例、视角位置两个维度，显性训练“比较”策略。"}, {"label": "讽刺逻辑图：全班钻进一个荒诞片段，三层读出作者藏在故事底下的“骂”。"}, {"label": "阶梯图：沿格列佛对“人类”态度的变化阶梯，推断卷四的情感走向。"}, {"label": "两难思辨阅读单：围绕“人是否配得上理性”，把书中判断与现实生活联结。"}, {"label": "应用创作·第五次航行：仿斯威夫特“先定内核、再编荒诞故事”反向创编。"}]}, {"name": "阅读策略学习", "children": [{"label": "提问：导读课读前/读中提出基于文本的问题，显性训练“提问”。"}, {"label": "比较：第二课时用对比表，从体型、视角两维细看小人国与大人国。"}, {"label": "推断：第三课时从“重复出现的事物”出发，推断作者意图。"}, {"label": "联结：思辨课把书中判断与自己的生活、今天的现实接起来。"}, {"label": "监控：阶梯图环节把“读不懂的那一阶”用红笔标记，显性化理解监控。"}]}, {"name": "可视化工具的运用", "children": [{"label": "思维导图：把四卷归并到一张图，看见“四次航海”反复的同一种开头。"}, {"label": "对比表：从体型比例、视角位置两个维度对照小人国与大人国。"}, {"label": "讽刺手法逻辑图：三层（表层→中层→内核）拆解一个荒诞片段的讽刺。"}, {"label": "阶梯图：呈现格列佛对“人类”态度的逐阶变化。"}, {"label": "计划表：导读课布置七天阅读计划，分配每日任务与圈画提示。"}, {"label": "两难思辨阅读单：思辨问题｜书中片段｜我的判断｜我的理由，四列推进思辨。"}]}]};
  const GAP = 6;        // 弧线端点与节点的水平间隙
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render(data) {
    document.getElementById('hL').textContent = data.header_left || '';
    document.getElementById('hR').textContent = data.header_right || '';
    document.getElementById('docTitle').textContent = data.title || '';
    const nodes = document.getElementById('nodes');
    nodes.innerHTML = '';
    const rootCol = el('div', 'root-col');
    const root = el('div', 'root', data.title);
    root.id = 'node-root';
    rootCol.appendChild(root);
    nodes.appendChild(rootCol);

    const area = el('div', 'branch-area');
    data.branches.forEach((br, bi) => {
      const rowEl = el('div', 'branch-row');
      const b = el('div', 'branch', br.name);
      b.id = 'branch-' + bi;
      rowEl.appendChild(b);

      const group = el('div', 'branch-group');
      group.id = 'group-' + bi;
      (br.children || []).forEach((c2, ci) => {
        const row = el('div', 'l2-row');
        const lbl = el('div', c2.children ? 'l2' : 'leaf', c2.label);
        lbl.id = `n-${bi}-${ci}`;
        row.appendChild(lbl);
        if (c2.children) {
          const l3col = el('div', 'l3-col');
          c2.children.forEach((c3, ti) => {
            const t = el('div', 'l3', c3.label);
            t.id = `n-${bi}-${ci}-${ti}`;
            l3col.appendChild(t);
          });
          row.appendChild(l3col);
        }
        group.appendChild(row);
      });
      rowEl.appendChild(group);
      area.appendChild(rowEl);
    });
    nodes.appendChild(area);
    requestAnimationFrame(drawLines);
  }
  function box(id) {
    const map = document.getElementById('map').getBoundingClientRect();
    const r = document.getElementById(id).getBoundingClientRect();
    return {
      leftX:  r.left - map.left,
      rightX: r.right - map.left,
      midY:   r.top - map.top + r.height / 2
    };
  }
  // 舒展大弧:水平方向用较大的控制点偏移,弧度更圆润
  function curve(x1, y1, x2, y2, spread) {
    spread = spread == null ? 0.6 : spread;
    const dx = (x2 - x1) * spread;
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }
  function mkpath(d, w) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line').trim());
    p.setAttribute('stroke-width', w || '1.6');
    p.setAttribute('stroke-linecap', 'round');
    return p;
  }
  function drawLines() {
    const svg = document.getElementById('svg');
    const map = document.getElementById('map').getBoundingClientRect();
    svg.setAttribute('width', map.width);
    svg.setAttribute('height', map.height);
    svg.setAttribute('viewBox', `0 0 ${map.width} ${map.height}`);
    svg.innerHTML = '';

    const rootB = box('node-root');
    // 主干竖线的 x 位置:中心节点右缘与分支左缘之间约 40%
    const branch0 = box('branch-0');
    const trunkX = rootB.rightX + (branch0.leftX - rootB.rightX) * 0.42;

    // 计算各分支竖向范围,画主干竖线
    const brBoxes = DATA.branches.map((_, bi) => box('branch-' + bi));
    const topY = brBoxes[0].midY;
    const botY = brBoxes[brBoxes.length - 1].midY;

    // 1) 中心节点 -> 主干:一条短弧从中心右缘接到主干中点
    const trunkMidY = (topY + botY) / 2;
    svg.appendChild(mkpath(curve(rootB.rightX + GAP, rootB.midY, trunkX, trunkMidY, 0.7)));
    // 2) 主干竖线(两端略微内收,后面用弧接到首末分支,形成自然收尾)
    const cap = 10;
    svg.appendChild(mkpath(`M ${trunkX} ${topY} L ${trunkX} ${botY}`, '1.6'));
    // 3) 主干 -> 各分支:从主干对应高度分出小弧接入分支左缘
    DATA.branches.forEach((br, bi) => {
      const brB = brBoxes[bi];
      svg.appendChild(mkpath(curve(trunkX, brB.midY, brB.leftX - GAP, brB.midY, 0.55)));

      // 4) 分支 -> 子节点:舒展大弧分叉(spread 越大越舒展)
      (br.children || []).forEach((c2, ci) => {
        const n2 = box(`n-${bi}-${ci}`);
        svg.appendChild(mkpath(curve(brB.rightX + GAP, brB.midY, n2.leftX - GAP, n2.midY, 0.75)));
        if (c2.children) {
          c2.children.forEach((c3, ti) => {
            const n3 = box(`n-${bi}-${ci}-${ti}`);
            svg.appendChild(mkpath(curve(n2.rightX + GAP, n2.midY, n3.leftX - GAP, n3.midY, 0.75)));
          });
        }
      });
    });
    document.body.setAttribute('data-rendered', '1');
  }
  if (DATA) render(DATA);
</script>
</body>
</html>
