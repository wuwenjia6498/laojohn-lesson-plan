<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #page {
    width: 794px; height: 1123px; background: #FFFFFF;
    position: relative; overflow: hidden;
  }
  .brand-logo { position: absolute; top: 34px; right: 42px; height: 50px; }
  .variant-tag { position: absolute; top: 38px; left: 46px; font-size: 13px; color: #B3A98F; letter-spacing: 1px; }
  .v-title { position: absolute; top: 72px; left: 0; width: 100%; text-align: center;
    font-size: 26px; font-weight: 700; color: #4A4A42; padding: 0 40px; line-height: 1.4; }
  .v-sub { position: absolute; top: 120px; left: 0; width: 100%; text-align: center;
    font-size: 16px; color: #8A8268; }
  svg { position: absolute; top: 170px; left: 0; }
  .lbl { font-family: "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 24px; }
  .item { font-family: "Microsoft YaHei", sans-serif; font-size: 16px; fill: #3A3A33; }
  .v-foot { position: absolute; bottom: 36px; left: 0; width: 100%; text-align: center;
    font-size: 14px; color: #9A937F; }
</style>
</head>
<body>
<div id="page">
  <img class="brand-logo" id="logo">
  <div class="variant-tag" id="variantTag"></div>
  <div class="v-title" id="title"></div>
  <div class="v-sub" id="subtitle"></div>
  <svg id="svg" width="794" height="900" viewBox="0 0 794 900"></svg>
  <div class="v-foot" id="foot"></div>
</div>
<script>
const DATA = /*__DATA__*/ null;
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

// 圆圈与写入区锚点（竖版）
const CX1=272, CX2=522, CY=440, R=212;
const SLOTS = {
  left:   { x: 188, ys: [368, 448, 528] },
  center: { x: 397, ys: [410, 490] },
  right:  { x: 606, ys: [368, 448, 528] },
};

function drawItems(svg, slot, items, color){
  const conf = SLOTS[slot];
  items.forEach((txt, i) => {
    if (i >= conf.ys.length) return;
    const y = conf.ys[i];
    if (txt && txt.trim() !== ""){
      const words = String(txt);
      const t = el("text", {x: conf.x, y: y, "text-anchor":"middle", class:"item"});
      const max = 11;
      let lines = [];
      for (let p=0; p<words.length; p+=max) lines.push(words.slice(p, p+max));
      lines.forEach((ln, li) => {
        const ts = el("tspan", {x: conf.x, dy: li===0?0:20});
        ts.textContent = ln; t.appendChild(ts);
      });
      svg.appendChild(t);
    } else {
      const w = slot==="center" ? 120 : 158;
      svg.appendChild(el("line", {x1: conf.x - w/2, y1: y, x2: conf.x + w/2, y2: y,
        stroke: color, "stroke-width": 1.5, "stroke-linecap":"round"}));
    }
  });
}

function render(){
  const d = DATA;
  document.getElementById('logo').src = d.logo;
  document.getElementById('title').textContent = d.title || '';
  const sub = document.getElementById('subtitle');
  if (d.subtitle) sub.textContent = d.subtitle; else sub.style.display='none';
  const tag = document.getElementById('variantTag');
  if (d.variant) tag.textContent = d.variant; else tag.style.display='none';
  const foot = document.getElementById('foot');
  if (d.footer) foot.textContent = d.footer; else foot.style.display='none';

  const svg = document.getElementById('svg');
  svg.appendChild(el("circle",{cx:CX1,cy:CY,r:R,fill:"#7FA86A","fill-opacity":0.28,stroke:"#6E9457","stroke-width":2}));
  svg.appendChild(el("circle",{cx:CX2,cy:CY,r:R,fill:"#D8B24E","fill-opacity":0.26,stroke:"#C29A38","stroke-width":2}));
  const labY = CY - R - 34;
  const L = el("text",{x:CX1-40,y:labY,"text-anchor":"middle",class:"lbl",fill:"#5C7A47"}); L.textContent=d.left_label||""; svg.appendChild(L);
  const C = el("text",{x:397,y:labY,"text-anchor":"middle",class:"lbl",fill:"#7A6B3A"}); C.textContent=d.center_label||"共同"; svg.appendChild(C);
  const R2 = el("text",{x:CX2+40,y:labY,"text-anchor":"middle",class:"lbl",fill:"#A07E2A"}); R2.textContent=d.right_label||""; svg.appendChild(R2);
  drawItems(svg, "left", d.left || [], "#6E9457");
  drawItems(svg, "center", d.center || [], "#9A8A4A");
  drawItems(svg, "right", d.right || [], "#C29A38");

  document.body.dataset.rendered='1';
}
render();
</script>
</body>
</html>
