<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #page { width: 794px; height: 1123px; background: #FFFFFF; position: relative; overflow: hidden; }
  .brand-logo { position: absolute; top: 32px; right: 42px; height: 48px; }
  .variant-tag { position: absolute; top: 36px; left: 46px; font-size: 13px; color: #B3A98F; letter-spacing: 1px; }
  .l-title { position: absolute; top: 74px; left: 0; width: 100%; text-align: center;
    font-size: 24px; font-weight: 700; color: #333; padding: 0 40px; line-height: 1.4; }
  .l-sub { position: absolute; top: 116px; left: 0; width: 100%; text-align: center;
    font-size: 15px; color: #8A8268; }
  .l-foot { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center;
    font-size: 14px; color: #9A937F; padding: 0 40px; }
  .hd { font-size: 16px; font-weight: 700; }
  .ftxt { font-size: 14px; fill: #3A3A33; }
</style>
</head>
<body>
<div id="page">
  <img class="brand-logo" id="logo">
  <div class="variant-tag" id="variantTag"></div>
  <div class="l-title" id="title"></div>
  <div class="l-sub" id="subtitle"></div>
  <svg id="svg" width="794" height="960" style="position:absolute; top:150px; left:0;"></svg>
  <div class="l-foot" id="foot"></div>
</div>
<script>
const DATA = /*__DATA__*/ null;
const SVGNS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
// 竖版台阶：每阶 riser 顶 x / tread y / 颜色（左下→右上）
const STEPS = [
  {X:72,  Y:815, color:"#D9883A"},
  {X:168, Y:650, color:"#A8504F"},
  {X:264, Y:485, color:"#5B7FA6"},
  {X:360, Y:320, color:"#C49B3E"},
];
const RUN=96, RISE=165, LINE_LEN=358, LINE_GAP=58;

function wrap(s, max){ const o=[]; for(let i=0;i<s.length;i+=max)o.push(s.slice(i,i+max)); return o; }

function render(){
  const d=DATA;
  document.getElementById('logo').src=d.logo;
  document.getElementById('title').textContent=d.title||'';
  const sub=document.getElementById('subtitle'); if(d.subtitle) sub.textContent=d.subtitle; else sub.style.display='none';
  const tag=document.getElementById('variantTag'); if(d.variant) tag.textContent=d.variant; else tag.style.display='none';
  const foot=document.getElementById('foot'); if(d.footer) foot.textContent=d.footer; else foot.style.display='none';

  const svg=document.getElementById('svg');
  const steps=d.steps||[];
  const n=steps.length;

  // 楼梯折线（浅灰）
  const pts=[];
  pts.push([22, STEPS[0].Y]);
  for(let i=0;i<n;i++){
    const s=STEPS[i];
    pts.push([s.X, s.Y]);
    pts.push([s.X, s.Y-RISE]);
    pts.push([s.X+RUN, s.Y-RISE]);
  }
  let dstr="M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
  svg.appendChild(el("path",{d:dstr,fill:"none",stroke:"#CBC4B6","stroke-width":2,"stroke-linejoin":"miter"}));
  const top=STEPS[n-1];
  svg.appendChild(el("polygon",{points:`${top.X+RUN},${top.Y-RISE-14} ${top.X+RUN-7},${top.Y-RISE} ${top.X+RUN+7},${top.Y-RISE}`,fill:"#9A937F"}));

  steps.forEach((st,i)=>{
    const s=STEPS[i];
    const lx=s.X+18, ly=s.Y;
    svg.appendChild(el("line",{x1:lx-6,y1:ly-38,x2:lx-6,y2:ly-14,stroke:s.color,"stroke-width":4,"stroke-linecap":"round"}));
    const hd=el("text",{x:lx+4,y:ly-21,class:"hd",fill:s.color}); hd.textContent=st.header||''; svg.appendChild(hd);
    const items=st.items||["",""];
    let rowY=ly+6;
    items.slice(0,2).forEach(it=>{
      if(it && it.trim()!==''){
        const lines=wrap(String(it), 24);
        lines.forEach((ln,li)=>{
          const t=el("text",{x:lx+6,y:rowY+li*22-4,class:"ftxt"}); t.textContent=ln; svg.appendChild(t);
        });
        svg.appendChild(el("line",{x1:lx+2,y1:rowY+lines.length*22,x2:lx+2+LINE_LEN,y2:rowY+lines.length*22,stroke:"#D8D2C5","stroke-width":1.3}));
        rowY += Math.max(2,lines.length)*22 + 16;
      } else {
        svg.appendChild(el("line",{x1:lx+2,y1:rowY,x2:lx+2+LINE_LEN,y2:rowY,stroke:s.color,"stroke-width":1.4,"stroke-opacity":0.55}));
        rowY += LINE_GAP;
      }
    });
  });
  document.body.dataset.rendered='1';
}
render();
</script>
</body>
</html>
