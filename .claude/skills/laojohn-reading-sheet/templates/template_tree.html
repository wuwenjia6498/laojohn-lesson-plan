<!DOCTYPE html>
<!-- 树形图：顶部根节点（要分的是什么）→ 竖线到横向总线 → N 条分支并排垂下，
     每支一列：彩色分支名框 + 可选小标签 + 书写线（按列高自动铺满）。分支数 2–5 自适应。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #page { width: 794px; height: 1123px; background: #FFFFFF; position: relative; overflow: hidden; }
  .brand-logo { position: absolute; top: 32px; right: 42px; height: 48px; }
  .variant-tag { position: absolute; top: 36px; left: 46px; font-size: 13px; color: #B3A98F; letter-spacing: 1px; }
  .l-title { position: absolute; top: 110px; left: 0; width: 100%; text-align: center;
    font-size: 23px; font-weight: 700; color: #333; padding: 0 56px; line-height: 1.4; }
  .l-sub { position: absolute; top: 154px; left: 0; width: 100%; text-align: center; font-size: 15px; color: #8A8268; }
  .l-foot { position: absolute; bottom: 28px; left: 0; width: 100%; text-align: left; font-size: 14px;
    color: #9A937F; padding: 0 40px; line-height: 1.6; }
  .root { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
  .rsub { font-size: 13px; fill: #F3EDE2; }
  .bh { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
  .bl { font-size: 12.5px; fill: #8A8268; }
</style>
</head>
<body>
<div id="page">
  <img class="brand-logo" id="logo">
  <div class="variant-tag" id="variantTag"></div>
  <div class="l-title" id="title"></div>
  <div class="l-sub" id="subtitle"></div>
  <svg id="svg" width="794" height="950" style="position:absolute; top:150px; left:0;"></svg>
  <div class="l-foot" id="foot"></div>
</div>
<script>
const DATA = /*__DATA__*/ null;
const SVGNS = "http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
// 智能折行：连续字母/数字视为不可拆 token；避头尾。与 relation 模板同一实现。
function wrap(s,max){
  s = String(s);
  const NO_HEAD = "，。、；：？！）】」』”’》%…—-";
  const NO_TAIL = "（【「『“‘《";
  const toks = s.match(/[A-Za-z0-9]+(?:[.\-–][A-Za-z0-9]+)*|[\s\S]/g) || [];
  const lines = []; let cur = "";
  for (const tk of toks){
    if (tk === "\n"){ lines.push(cur); cur = ""; continue; }
    if (cur !== "" && cur.length + tk.length > max && NO_HEAD.indexOf(tk) === -1){
      let carry = "";
      while (cur && NO_TAIL.indexOf(cur[cur.length - 1]) !== -1){ carry = cur[cur.length - 1] + carry; cur = cur.slice(0, -1); }
      lines.push(cur); cur = carry + tk;
    } else { cur += tk; }
  }
  if (cur !== "") lines.push(cur);
  return lines;
}
function mixWhite(hex, a){
  const h = hex.replace('#','');
  const c = [0,2,4].map(i=>parseInt(h.substr(i,2),16));
  return '#' + c.map(v=>Math.round(255 - (255 - v) * a).toString(16).padStart(2,'0')).join('');
}
const PALETTE = ["#5B8C7B","#C18A3A","#5B7FA6","#8268A0","#A8634F","#7A8C3A"];

// 几何常量（svg 坐标；svg 顶 = 页面 150px）。render_pptx.py 的 render_tree() 须同步。
const MARGIN = 34, GAP = 14;
const ROOT_Y = 40, ROOT_W = 380, ROOT_H = 66;
const BUS_Y = 146, COL_TOP = 182, COL_BOTTOM = 872;
const LINE_GAP = 56, STROKE = "#A8957A";

function render(){
  const d = DATA;
  document.getElementById('logo').src = d.logo;
  document.getElementById('title').textContent = d.title || '';
  const sub = document.getElementById('subtitle'); if(d.subtitle) sub.textContent = d.subtitle; else sub.style.display='none';
  const tag = document.getElementById('variantTag'); if(d.variant) tag.textContent = d.variant; else tag.style.display='none';
  const foot = document.getElementById('foot'); if(d.footer) foot.textContent = d.footer; else foot.style.display='none';

  const svg = document.getElementById('svg');
  const branches = d.branches || [];
  const n = branches.length || 1;
  const colW = (794 - 2*MARGIN - (n-1)*GAP) / n;
  const rootColor = d.color || "#6B5442";

  // 根节点
  const rx0 = 397 - ROOT_W/2;
  svg.appendChild(el("rect",{x:rx0, y:ROOT_Y, width:ROOT_W, height:ROOT_H, rx:12, fill:rootColor}));
  const rootLines = wrap(d.root || '', 18).slice(0,2);
  const hasSub = !!d.root_sub;
  const blockH = rootLines.length*24 + (hasSub ? 20 : 0);
  let ty = ROOT_Y + (ROOT_H - blockH)/2 + 19;
  rootLines.forEach(ln=>{ const t=el("text",{x:397, y:Math.round(ty), class:"root", "text-anchor":"middle"}); t.textContent=ln; svg.appendChild(t); ty += 24; });
  if(hasSub){ const t=el("text",{x:397, y:Math.round(ty-2), class:"rsub", "text-anchor":"middle"}); t.textContent=d.root_sub; svg.appendChild(t); }

  // 分支名框高度：各支统一取最大折行数
  const perLine = Math.max(4, Math.floor((colW - 18) / 15.5));
  const headRows = Math.max(1, ...branches.map(b => Math.min(3, wrap(b.header || '', perLine).length)));
  const HEAD_H = 20 + headRows*21;

  // 连接线：根 → 总线 → 各支
  const cxs = branches.map((b,i)=> MARGIN + i*(colW+GAP) + colW/2);
  svg.appendChild(el("line",{x1:397, y1:ROOT_Y+ROOT_H, x2:397, y2:BUS_Y, stroke:STROKE, "stroke-width":2}));
  if(n > 1) svg.appendChild(el("line",{x1:cxs[0], y1:BUS_Y, x2:cxs[n-1], y2:BUS_Y, stroke:STROKE, "stroke-width":2}));
  svg.appendChild(el("circle",{cx:397, cy:BUS_Y, r:4.5, fill:STROKE}));

  branches.forEach((b,i)=>{
    const x = MARGIN + i*(colW+GAP), cx = cxs[i];
    const color = b.color || PALETTE[i % PALETTE.length];
    svg.appendChild(el("line",{x1:cx, y1:BUS_Y, x2:cx, y2:COL_TOP, stroke:STROKE, "stroke-width":2}));
    svg.appendChild(el("circle",{cx:cx, cy:BUS_Y, r:4, fill:STROKE}));

    // 列底框 + 分支名框
    svg.appendChild(el("rect",{x:x, y:COL_TOP, width:colW, height:COL_BOTTOM-COL_TOP, rx:12,
      fill:mixWhite(color, 0.07), stroke:color, "stroke-width":1.5}));
    svg.appendChild(el("rect",{x:x, y:COL_TOP, width:colW, height:HEAD_H, rx:12, fill:color}));
    svg.appendChild(el("rect",{x:x, y:COL_TOP+HEAD_H-12, width:colW, height:12, fill:color}));
    const hl = wrap(b.header || '', perLine).slice(0,3);
    let hy = COL_TOP + (HEAD_H - hl.length*21)/2 + 16;
    hl.forEach(ln=>{ const t=el("text",{x:cx, y:Math.round(hy), class:"bh", "text-anchor":"middle"}); t.textContent=ln; svg.appendChild(t); hy += 21; });

    // 可选小标签
    let y = COL_TOP + HEAD_H + 10;
    const label = (b.label != null) ? b.label : (d.label || '');
    if(label){
      const ll = wrap(label, Math.max(4, Math.floor((colW - 24) / 12.8))).slice(0,3);
      ll.forEach((ln,li)=>{ const t=el("text",{x:x+12, y:Math.round(y+14+li*17), class:"bl"}); t.textContent=ln; svg.appendChild(t); });
      y += 8 + ll.length*17;
    }

    // 书写线：给了 lines 就照给，否则按剩余高度铺满
    const firstY = y + LINE_GAP - 8;
    const room = COL_BOTTOM - 14 - firstY;
    const auto = Math.max(1, Math.floor(room / LINE_GAP) + 1);
    const lines = (b.lines != null) ? b.lines : (d.lines != null ? d.lines : auto);
    for(let k=0;k<lines;k++){
      const ly = firstY + k*LINE_GAP;
      if(ly > COL_BOTTOM - 10) break;
      svg.appendChild(el("line",{x1:x+12, y1:Math.round(ly), x2:x+colW-12, y2:Math.round(ly),
        stroke:mixWhite(color, 0.45), "stroke-width":1.2, "stroke-dasharray":"4 3"}));
    }
  });

  document.body.dataset.rendered = '1';
}
render();
</script>
</body>
</html>
