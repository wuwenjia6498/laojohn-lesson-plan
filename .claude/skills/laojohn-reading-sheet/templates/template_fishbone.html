<!DOCTYPE html>
<!-- 鱼骨图：横向主干 + 斜向支骨，每骨一事件框（上下交替）。头/尾=终点/起点。支骨数自适应。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #page { width: 794px; height: 1123px; background: #FFFFFF; position: relative; overflow: hidden; }
  .brand-logo { position: absolute; top: 32px; right: 42px; height: 48px; }
  .variant-tag { position: absolute; top: 36px; left: 46px; font-size: 13px; color: #B3A98F; letter-spacing: 1px; }
  .l-title { position: absolute; top: 74px; left: 0; width: 100%; text-align: center;
    font-size: 23px; font-weight: 700; color: #333; padding: 0 56px; line-height: 1.4; }
  .l-sub { position: absolute; top: 116px; left: 0; width: 100%; text-align: center; font-size: 15px; color: #8A8268; }
  .l-foot { position: absolute; bottom: 28px; left: 0; width: 100%; text-align: center; font-size: 14px; color: #9A937F; padding: 0 40px; }
  .hd { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  .endlab { font-size: 16px; font-weight: 700; fill: #5A5048; }
  .ftxt { font-size: 13px; fill: #3A3A33; }
</style>
</head>
<body>
<div id="page">
  <img class="brand-logo" id="logo">
  <div class="variant-tag" id="variantTag"></div>
  <div class="l-title" id="title"></div>
  <div class="l-sub" id="subtitle"></div>
  <svg id="svg" width="794" height="950" style="position:absolute; top:150px; left:0;"></svg>
  <div class="l-foot" id="foot"></div>
</div>
<script>
const DATA = /*__DATA__*/ null;
const SVGNS = "http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function wrap(s,max){const o=[];for(let i=0;i<s.length;i+=max)o.push(s.slice(i,i+max));return o;}
const PALETTE = ["#5B8C7B","#C18A3A","#7A8C3A","#5B7FA6","#A8634F","#8268A0"];

const SPINE_Y = 470, X_TAIL = 150, X_HEAD = 596, BOX_W = 150, BOX_H = 80;
function render(){
  const d = DATA;
  document.getElementById('logo').src = d.logo;
  document.getElementById('title').textContent = d.title || '';
  const sub = document.getElementById('subtitle'); if(d.subtitle) sub.textContent = d.subtitle; else sub.style.display='none';
  const tag = document.getElementById('variantTag'); if(d.variant) tag.textContent = d.variant; else tag.style.display='none';
  const foot = document.getElementById('foot'); if(d.footer) foot.textContent = d.footer; else foot.style.display='none';

  const svg = document.getElementById('svg');
  const ribs = d.ribs || [];
  const n = ribs.length;

  // 主干 + 鱼头(右,三角) + 鱼尾(左,双叉)
  svg.appendChild(el("line",{x1:X_TAIL, y1:SPINE_Y, x2:X_HEAD, y2:SPINE_Y, stroke:"#C9A24A", "stroke-width":5, "stroke-linecap":"round"}));
  svg.appendChild(el("polygon",{points:`${X_HEAD},${SPINE_Y-44} ${X_HEAD+84},${SPINE_Y} ${X_HEAD},${SPINE_Y+44}`, fill:"#E7C46A"}));
  svg.appendChild(el("polygon",{points:`${X_TAIL},${SPINE_Y} ${X_TAIL-58},${SPINE_Y-40} ${X_TAIL-40},${SPINE_Y} ${X_TAIL-58},${SPINE_Y+40}`, fill:"#E7C46A"}));
  // 头/尾文字
  const hl = el("text",{x:X_HEAD+90, y:SPINE_Y+5, class:"endlab", "text-anchor":"start"}); hl.textContent = d.head_label || ''; svg.appendChild(hl);
  const tl = el("text",{x:X_TAIL-66, y:SPINE_Y+5, class:"endlab", "text-anchor":"end"}); tl.textContent = d.tail_label || ''; svg.appendChild(tl);

  // 支骨：沿主干等距，上下交替
  const segL = X_TAIL + 30, segR = X_HEAD - 20;
  ribs.forEach((rb,i)=>{
    const t = n>1 ? i/(n-1) : 0.5;
    const sx = Math.round(segL + (segR - segL) * t);          // 骨在主干上的根点
    const up = (rb.side ? rb.side === 'up' : (i % 2 === 0));   // 默认偶数在上
    const color = PALETTE[i % PALETTE.length];
    const dir = up ? -1 : 1;
    const ex = sx + 66, ey = SPINE_Y + dir * 150;              // 斜骨外端（朝鱼头方向上扬）
    svg.appendChild(el("line",{x1:sx, y1:SPINE_Y, x2:ex, y2:ey, stroke:"#B7AE9C", "stroke-width":2}));
    // 事件框（外端）
    const bx = Math.max(6, Math.min(794-6-BOX_W, ex - BOX_W/2));
    const by = up ? ey - BOX_H : ey;
    svg.appendChild(el("rect",{x:bx, y:by, width:BOX_W, height:BOX_H, rx:8, fill:"#FFFFFF", stroke:color, "stroke-width":1.6}));
    svg.appendChild(el("rect",{x:bx, y:by, width:BOX_W, height:22, rx:8, fill:color}));
    svg.appendChild(el("rect",{x:bx, y:by+12, width:BOX_W, height:10, fill:color}));
    const hd = el("text",{x:bx+10, y:by+15, class:"hd"}); hd.textContent = rb.header || ('第'+(i+1)+'件'); svg.appendChild(hd);
    if(rb.text && rb.text.trim() !== ''){
      const lines = wrap(String(rb.text), 11).slice(0,2);
      lines.forEach((ln,li)=>{ const t2=el("text",{x:bx+10, y:by+42+li*18, class:"ftxt"}); t2.textContent=ln; svg.appendChild(t2); });
    } else {
      svg.appendChild(el("line",{x1:bx+10, y1:by+44, x2:bx+BOX_W-10, y2:by+44, stroke:"#CFC8BA", "stroke-width":1.2}));
      svg.appendChild(el("line",{x1:bx+10, y1:by+66, x2:bx+BOX_W-10, y2:by+66, stroke:"#CFC8BA", "stroke-width":1.2}));
    }
  });
  document.body.dataset.rendered = '1';
}
render();
</script>
</body>
</html>
