<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink:        #3a3531;
    --line:       #c7a98a;
    --root-bg:    #BF826F;
    --root-ink:   #ffffff;
    --branch-bg:  #D1B397;
    --branch-ink: #3a3531;
    --leaf-ink:   #4a443f;
    --header-ink: #B8B8B8;
    --rule:       #B8B8B8;
    --page:       #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--page);
  }
  .page {
    position: relative;
    width: 794px;
    min-height: 1123px;
    padding: 48px 52px 44px;
    background: var(--page);
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: var(--header-ink);
    letter-spacing: 1px;
    padding-bottom: 9px;
    border-bottom: 1.5px solid var(--rule);
    flex: 0 0 auto;
  }
  .doc-title {
    position: absolute;
    top: 112px; left: 0; right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2px;
    z-index: 3;
  }
  /* 导图区吃满页眉以下全部高度,导图作为紧凑块在其中垂直居中 */
  .map {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
  }
  .svg-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .nodes-layer {
    position: relative; z-index: 2;
    width: 100%;
    display: grid;
    grid-template-columns: 132px 1fr;   /* 中心列 | 右侧分支区 */
    align-items: center;
    column-gap: 40px;
  }
  .root-col { display: flex; align-items: center; justify-content: center; }
  .root {
    background: var(--root-bg);
    color: var(--root-ink);
    border-radius: 16px;
    padding: 18px 16px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    width: 142px;
    box-shadow: 0 2px 7px rgba(150,110,80,.18);
  }
  /* 右侧分支区:每个分支一行,纵向按内容自然高度堆叠 */
  .branch-area {
    display: flex; flex-direction: column;
    gap: 20px;                  /* 分支之间的固定间距 */
  }
  /* 一行 = [分支节点 | 子组],分支垂直居中对齐到子组中线 */
  .branch-row {
    display: grid;
    grid-template-columns: 104px 1fr;
    align-items: center;
    column-gap: 36px;
  }
  .branch {
    background: var(--branch-bg);
    color: var(--branch-ink);
    border-radius: 9px;
    padding: 9px 4px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
  }
  .branch-group {
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .l2-row { display: flex; align-items: center; }
  .l2 {
    font-size: 12.5px; font-weight: 600;
    color: var(--leaf-ink); line-height: 1.45;
    padding: 2px 0 2px 6px; white-space: nowrap;
  }
  .l3-col {
    display: flex; flex-direction: column;
    justify-content: center; gap: 6px;
    margin-left: 34px;   /* 二级→三级跨度 */
  }
  .l3 {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 1px 0 1px 6px;
    white-space: nowrap;
  }
  .leaf {
    font-size: 11.5px; color: var(--leaf-ink);
    line-height: 1.4; padding: 2px 0 2px 6px;
    white-space: pre;   /* 不自动折行（同 nowrap）；label 里写换行符才断行，供超长叶手动折行 */
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="header">
    <span id="hL"></span>
    <span id="hR"></span>
  </div>
  <div class="doc-title" id="docTitle"></div>
  <div class="map" id="map">
    <svg class="svg-layer" id="svg"></svg>
    <div class="nodes-layer" id="nodes"></div>
  </div>
</div>
<script>
  const DATA = /*__DATA__*/ null;
  const GAP = 6;        // 弧线端点与节点的水平间隙
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render(data) {
    document.getElementById('hL').textContent = data.header_left || '';
    document.getElementById('hR').textContent = data.header_right || '';
    document.getElementById('docTitle').textContent = data.title || '';
    const nodes = document.getElementById('nodes');
    nodes.innerHTML = '';
    const rootCol = el('div', 'root-col');
    const root = el('div', 'root', data.title);
    root.id = 'node-root';
    rootCol.appendChild(root);
    nodes.appendChild(rootCol);

    const area = el('div', 'branch-area');
    data.branches.forEach((br, bi) => {
      const rowEl = el('div', 'branch-row');
      const b = el('div', 'branch', br.name);
      b.id = 'branch-' + bi;
      rowEl.appendChild(b);

      const group = el('div', 'branch-group');
      group.id = 'group-' + bi;
      (br.children || []).forEach((c2, ci) => {
        const row = el('div', 'l2-row');
        const lbl = el('div', c2.children ? 'l2' : 'leaf', c2.label);
        lbl.id = `n-${bi}-${ci}`;
        row.appendChild(lbl);
        if (c2.children) {
          const l3col = el('div', 'l3-col');
          c2.children.forEach((c3, ti) => {
            const t = el('div', 'l3', c3.label);
            t.id = `n-${bi}-${ci}-${ti}`;
            l3col.appendChild(t);
          });
          row.appendChild(l3col);
        }
        group.appendChild(row);
      });
      rowEl.appendChild(group);
      area.appendChild(rowEl);
    });
    nodes.appendChild(area);
    requestAnimationFrame(drawLines);
  }
  function box(id) {
    const map = document.getElementById('map').getBoundingClientRect();
    const r = document.getElementById(id).getBoundingClientRect();
    return {
      leftX:  r.left - map.left,
      rightX: r.right - map.left,
      midY:   r.top - map.top + r.height / 2
    };
  }
  // 舒展大弧:水平方向用较大的控制点偏移,弧度更圆润
  function curve(x1, y1, x2, y2, spread) {
    spread = spread == null ? 0.6 : spread;
    const dx = (x2 - x1) * spread;
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }
  function mkpath(d, w) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line').trim());
    p.setAttribute('stroke-width', w || '1.6');
    p.setAttribute('stroke-linecap', 'round');
    return p;
  }
  function drawLines() {
    const svg = document.getElementById('svg');
    const map = document.getElementById('map').getBoundingClientRect();
    svg.setAttribute('width', map.width);
    svg.setAttribute('height', map.height);
    svg.setAttribute('viewBox', `0 0 ${map.width} ${map.height}`);
    svg.innerHTML = '';

    const rootB = box('node-root');
    // 主干竖线的 x 位置:中心节点右缘与分支左缘之间约 40%
    const branch0 = box('branch-0');
    const trunkX = rootB.rightX + (branch0.leftX - rootB.rightX) * 0.42;

    // 计算各分支竖向范围,画主干竖线
    const brBoxes = DATA.branches.map((_, bi) => box('branch-' + bi));
    const topY = brBoxes[0].midY;
    const botY = brBoxes[brBoxes.length - 1].midY;

    // 1) 中心节点 -> 主干:一条短弧从中心右缘接到主干中点
    const trunkMidY = (topY + botY) / 2;
    svg.appendChild(mkpath(curve(rootB.rightX + GAP, rootB.midY, trunkX, trunkMidY, 0.7)));
    // 2) 主干竖线(两端略微内收,后面用弧接到首末分支,形成自然收尾)
    const cap = 10;
    svg.appendChild(mkpath(`M ${trunkX} ${topY} L ${trunkX} ${botY}`, '1.6'));
    // 3) 主干 -> 各分支:从主干对应高度分出小弧接入分支左缘
    DATA.branches.forEach((br, bi) => {
      const brB = brBoxes[bi];
      svg.appendChild(mkpath(curve(trunkX, brB.midY, brB.leftX - GAP, brB.midY, 0.55)));

      // 4) 分支 -> 子节点:舒展大弧分叉(spread 越大越舒展)
      (br.children || []).forEach((c2, ci) => {
        const n2 = box(`n-${bi}-${ci}`);
        svg.appendChild(mkpath(curve(brB.rightX + GAP, brB.midY, n2.leftX - GAP, n2.midY, 0.75)));
        if (c2.children) {
          c2.children.forEach((c3, ti) => {
            const n3 = box(`n-${bi}-${ci}-${ti}`);
            svg.appendChild(mkpath(curve(n2.rightX + GAP, n2.midY, n3.leftX - GAP, n3.midY, 0.75)));
          });
        }
      });
    });
    document.body.setAttribute('data-rendered', '1');
  }
  if (DATA) render(DATA);
</script>
</body>
</html>
