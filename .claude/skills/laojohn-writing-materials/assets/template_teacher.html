<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>教师用</title>
<style>
  /* ===== 设计令牌（固定骨架，勿改）===== */
  :root{
    --brand-red:#C8352B;--ink:#3A3A38;--ink-soft:#7A7568;--paper:#FFFFFF;
    --brown-head:#A89B8A;--brown-deep:#7D7468;--brown-cell:#EFEBE3;--brown-line:#C9C0B0;--zebra:#F7F5F0;
    --blue-head:#5B7A99;--blue-soft:#E7EEF3;--blue-line:#AEC2D2;--blue-deep:#3E5A73;
    --warn-bg:#FBEEE8;--warn-line:#D89478;--warn-ink:#A85434;
    --keep:#3E7D5A;--keep-bg:#E8F2EC;      /* 必守 绿 */
    --free:#B07B2E;--free-bg:#F7EEDD;      /* 可发挥 黄 */
    --why:#5B6E99;--why-bg:#E9ECF5;        /* 设计意图 蓝 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#EDEAE3;}
  @media print{ html,body{background:#fff;} .sheet{box-shadow:none!important;margin:0!important;min-height:auto!important;} }
  .page-break{ page-break-before:always; }
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sheet{width:210mm;min-height:297mm;margin:14px auto;background:var(--paper);
    padding:14mm 15mm 12mm;box-shadow:0 2px 18px rgba(0,0,0,.12);position:relative;}

  /* ===== 品牌页眉：左侧用途标签 + 右侧真 logo（品牌资产\logo.png 注入）===== */
  .brandbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4mm;}
  .toptag{font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;margin-top:6px;}
  .logo-img{height:42px;width:auto;display:block;}

  .titlewrap{border-bottom:2.5px solid var(--brown-head);padding-bottom:3mm;margin-bottom:4mm;}
  .kicker{font-size:10.5px;color:var(--blue-deep);font-weight:700;letter-spacing:2px;margin-bottom:2px;}
  h1{font-size:20px;font-weight:800;color:var(--ink);}
  h1 .light{color:var(--ink-soft);font-weight:600;font-size:15px;}

  .sech{font-size:12px;font-weight:800;color:var(--blue-deep);margin:0 0 2.5mm;
    display:flex;align-items:center;gap:6px;}
  .sech::before{content:"";width:4px;height:14px;background:var(--blue-head);border-radius:2px;}

  /* ===== 速览页：目标条 ===== */
  .goal{background:var(--blue-soft);border-radius:5px;padding:3mm 4mm;margin-bottom:4mm;
    font-size:11.5px;line-height:1.65;color:var(--ink);}
  .goal b{color:var(--blue-deep);}

  /* ===== 速览页：两节时间轴 ===== */
  .timeline{display:flex;gap:5mm;margin-bottom:4mm;}
  .lesson{flex:1;}
  .lesson .lh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;
    padding-bottom:1.5mm;border-bottom:1px solid var(--brown-line);}
  .step{display:flex;align-items:baseline;gap:6px;font-size:11px;margin-bottom:1.5mm;line-height:1.4;}
  .step .min{background:var(--brown-cell);color:var(--brown-deep);font-weight:700;font-size:9.5px;
    padding:1px 5px;border-radius:8px;flex-shrink:0;min-width:34px;text-align:center;}
  .step .name{color:var(--ink);}
  .step.after{margin-top:3mm;color:var(--ink-soft);}
  .step.after .min{background:none;}

  /* ===== 速览页：易错点 / 最不能念稿（共用警示条）===== */
  .warns{background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:0 5px 5px 0;
    padding:3mm 4mm;margin-bottom:4mm;}
  .warns .wh{font-size:11px;font-weight:800;color:var(--warn-ink);margin-bottom:2mm;}
  .warns .w{font-size:10.8px;color:var(--ink);margin-bottom:1.2mm;line-height:1.45;padding-left:14px;position:relative;}
  .warns .w::before{content:"⚠";position:absolute;left:0;color:var(--warn-line);font-size:10px;}
  .warns .w b{color:var(--warn-ink);}

  /* ===== 速览页：示范文 ===== */
  .essaybox{border:1.5px solid var(--brown-line);border-radius:5px;padding:4mm 5mm;margin-bottom:4mm;
    background:#FEFDFB;}
  .essaybox .et{font-size:12px;font-weight:800;text-align:center;margin-bottom:2mm;color:var(--ink);}
  .essaybox p{font-size:10.5px;line-height:1.7;text-indent:2em;margin-bottom:1mm;color:var(--ink);}

  /* ===== 速览页：物料清单 ===== */
  .materials{background:var(--zebra);border:1px solid var(--brown-line);border-radius:5px;padding:3mm 4mm;}
  .materials .mh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;}
  .mlist{display:flex;flex-wrap:wrap;gap:2mm 4mm;}
  .mlist .m{font-size:10.5px;color:var(--ink);display:flex;align-items:center;gap:5px;}
  .mlist .m .chk{width:11px;height:11px;border:1.5px solid var(--brown-line);border-radius:2px;flex-shrink:0;}

  /* ===== 怎么讲活页 ===== */
  .pg-dn .titlewrap{margin-bottom:3mm;}
  .intro{font-size:11px;color:var(--ink-soft);line-height:1.6;margin-bottom:3mm;}
  .intro b{color:var(--ink);}

  .legend{display:flex;gap:5mm;margin-bottom:4mm;font-size:10px;}
  .legend .lg{display:flex;align-items:center;gap:5px;}
  .legend .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .lg.keep .dot{background:var(--keep);} .lg.free .dot{background:var(--free);} .lg.why .dot{background:var(--why);}
  .legend .lg b{font-weight:700;}

  .env{margin-bottom:3.5mm;border:1px solid var(--brown-line);border-radius:5px;overflow:hidden;}
  .env .eh{background:var(--brown-cell);padding:2mm 4mm;font-size:11.5px;font-weight:800;color:var(--brown-deep);}
  .env .rows{padding:2.5mm 4mm;display:flex;flex-direction:column;gap:1.8mm;}
  .row{display:flex;gap:7px;font-size:10.6px;line-height:1.4;}
  .row .tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;flex-shrink:0;height:fit-content;
    white-space:nowrap;min-width:52px;text-align:center;}
  .row.keep .tag{background:var(--keep-bg);color:var(--keep);}
  .row.free .tag{background:var(--free-bg);color:var(--free);}
  .row.why .tag{background:var(--why-bg);color:var(--why);}
  .row .txt{color:var(--ink);}
  .row .txt b{color:var(--brown-deep);}

  .nono{background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:0 5px 5px 0;
    padding:3mm 4mm;margin-top:1mm;}
  .nono .nh{font-size:11px;font-weight:800;color:var(--warn-ink);margin-bottom:2mm;}
  .nono .n{font-size:10.5px;color:var(--ink);margin-bottom:1.5mm;line-height:1.45;padding-left:15px;position:relative;}
  /* 用 × U+00D7（雅黑字表内）而非 ✕ U+2715：后者要回退到 Segoe UI Symbol，会被打成 Type3 */
  .nono .n::before{content:"×";position:absolute;left:0;color:var(--warn-line);font-weight:800;font-size:11px;}
  .nono .n b{color:var(--warn-ink);}
</style>
</head>
<body>

<!-- ============ 第 1 页：教师速览页 ============ -->
<div class="sheet pg-ov">

  <div class="brandbar">
    <div class="toptag">教师速览页 · 上课前扫一遍</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker" id="ov-kicker"></div>
    <h1><span id="ov-topic"></span> <span class="light" id="ov-genre"></span></h1>
  </div>

  <div class="goal"><b>一句话目标：</b><span id="ov-goal"></span></div>

  <div class="sech">两节课时间轴</div>
  <div class="timeline" id="ov-timeline"></div>

  <div class="warns">
    <div class="wh" id="ov-warns-title"></div>
    <div id="ov-warns"></div>
  </div>

  <div class="sech">教师示范文（可投屏 / 读给学生听）</div>
  <div class="essaybox">
    <div class="et" id="ov-essay-title"></div>
    <div id="ov-essay"></div>
  </div>

  <div class="materials">
    <div class="mh">这一课要发 / 用的物料</div>
    <div class="mlist" id="ov-materials"></div>
  </div>

</div>

<!-- ============ 第 2 页：怎么讲活（三色旁注） ============ -->
<div class="sheet page-break pg-dn">

  <div class="brandbar">
    <div class="toptag">「怎么讲活」旁注 · 备课时过一遍</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker" id="dn-kicker"></div>
    <h1>怎么把这节课讲活 <span class="light" id="dn-topic"></span></h1>
  </div>

  <p class="intro">下面按环节标出三件事：<b>哪几步必须照做</b>（漏了这节课就散），<b>哪几处可以用你自己的话、你班的例子讲</b>，
  以及这一步<b>为什么这么安排</b>。</p>

  <div class="legend">
    <div class="lg keep"><span class="dot"></span><b>必守</b>·照这个做</div>
    <div class="lg free"><span class="dot"></span><b>可放开</b>·用你的话</div>
    <div class="lg why"><span class="dot"></span><b>为什么</b>·设计意图</div>
  </div>

  <div id="dn-envs"><!-- 环节旁批由 JS 注入 --></div>

  <div class="nono">
    <div class="nh" id="dn-nono-title"></div>
    <div id="dn-nono"></div>
  </div>

</div>

<script>
  const DATA = /*__DATA__*/ null;

  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // 富文本标记：{b}…{/b} → 加粗（各区块有各自强调色）
  function rich(s){return esc(s).replace(/\{b\}/g,'<b>').replace(/\{\/b\}/g,'</b>');}

  const ROW_LABEL={keep:'必守',free:'可放开',why:'为什么'};

  function fill(){
    const d=DATA, m=d.meta;
    document.title='教师用 · '+m.topic;

    /* ---- 第 1 页：速览页 ---- */
    const o=d.overview;
    document.getElementById('ov-kicker').textContent=m.kicker+'　｜　2 节 × 45 分钟连排';
    document.getElementById('ov-topic').textContent=m.topic;
    document.getElementById('ov-genre').textContent='· '+m.genre;
    document.getElementById('ov-goal').innerHTML=rich(o.goal);

    const tl=document.getElementById('ov-timeline');
    o.lessons.forEach(les=>{
      const box=document.createElement('div'); box.className='lesson';
      let html='<div class="lh">'+esc(les.title)+'</div>';
      les.steps.forEach(s=>{
        html+='<div class="step"><span class="min">'+esc(s.min)+'</span><span class="name">'+esc(s.name)+'</span></div>';
      });
      if(les.after){
        html+='<div class="step after"><span class="min">课后</span><span class="name">'+esc(les.after)+'</span></div>';
      }
      box.innerHTML=html; tl.appendChild(box);
    });

    document.getElementById('ov-warns-title').textContent='这一课最容易翻车的 '+o.warns.length+' 处';
    const wbox=document.getElementById('ov-warns');
    o.warns.forEach(t=>{
      const div=document.createElement('div'); div.className='w'; div.innerHTML=rich(t); wbox.appendChild(div);
    });

    document.getElementById('ov-essay-title').textContent=o.essay.title;
    const ebox=document.getElementById('ov-essay');
    o.essay.paragraphs.forEach(t=>{
      const p=document.createElement('p'); p.textContent=t; ebox.appendChild(p);
    });

    const mbox=document.getElementById('ov-materials');
    o.materials.forEach(t=>{
      const div=document.createElement('div'); div.className='m';
      div.innerHTML='<span class="chk"></span>'+esc(t); mbox.appendChild(div);
    });

    /* ---- 第 2 页：怎么讲活 ---- */
    const n=d.delivery;
    document.getElementById('dn-kicker').textContent=m.kicker;
    document.getElementById('dn-topic').textContent='· '+m.topic;

    const envs=document.getElementById('dn-envs');
    n.envs.forEach(env=>{
      const box=document.createElement('div'); box.className='env';
      let rows='';
      env.rows.forEach(r=>{
        rows+='<div class="row '+esc(r.type)+'"><span class="tag">'+(ROW_LABEL[r.type]||r.type)+
              '</span><span class="txt">'+rich(r.text)+'</span></div>';
      });
      box.innerHTML='<div class="eh">'+esc(env.heading)+'</div><div class="rows">'+rows+'</div>';
      envs.appendChild(box);
    });

    document.getElementById('dn-nono-title').textContent='这 '+n.nono.length+' 处，最容易讲僵';
    const nbox=document.getElementById('dn-nono');
    n.nono.forEach(t=>{
      const div=document.createElement('div'); div.className='n'; div.innerHTML=rich(t); nbox.appendChild(div);
    });
  }

  window.addEventListener('load',()=>{
    fill();
    setTimeout(()=>{ document.body.dataset.rendered='1'; },100);
  });
</script>
</body>
</html>
