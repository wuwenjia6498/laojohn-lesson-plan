<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长合订</title>
<style>
  /* ===== 设计令牌（固定骨架，勿改）===== */
  :root{
    --brand-red:#C8352B;--ink:#3A3A38;--ink-soft:#7A7568;--paper:#FFFFFF;
    --brown-head:#A89B8A;--brown-deep:#7D7468;--brown-cell:#EFEBE3;--brown-line:#C9C0B0;--zebra:#F7F5F0;
    --blue-head:#5B7A99;--blue-soft:#E7EEF3;--blue-line:#AEC2D2;--blue-deep:#3E5A73;
    --warm-bg:#FBF3EC;--warm-line:#D8B99C;--warm-ink:#9A6A44;
    --green:#3E7D5A;--green-bg:#E8F2EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#EDEAE3;}
  @media print{ html,body{background:#fff;} .sheet{box-shadow:none!important;margin:0!important;min-height:auto!important;} }
  .page-break{ page-break-before:always; }
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sheet{width:210mm;min-height:297mm;margin:14px auto;background:var(--paper);
    padding:15mm 15mm 12mm;box-shadow:0 2px 18px rgba(0,0,0,.12);position:relative;}

  /* ===== 品牌页眉：左侧用途标签 + 右侧真 logo（品牌资产\logo.png 注入）===== */
  .brandbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4mm;}
  .toptag{font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;margin-top:6px;}
  .logo-img{height:42px;width:auto;display:block;}

  .titlewrap{border-bottom:2.5px solid var(--brown-head);padding-bottom:3mm;margin-bottom:4mm;}
  .kicker{font-size:10.5px;color:var(--blue-deep);font-weight:700;letter-spacing:2px;margin-bottom:2px;}
  h1{font-size:21px;font-weight:800;color:var(--ink);}
  h1 .light{color:var(--ink-soft);font-weight:600;font-size:15px;}

  .sech{font-size:12.5px;font-weight:800;color:var(--blue-deep);margin:0 0 2.5mm;
    display:flex;align-items:center;gap:6px;}
  .sech::before{content:"";width:4px;height:15px;background:var(--blue-head);border-radius:2px;}

  /* ===== 家长一页纸 ===== */
  .pg-op{line-height:1.6;}
  .pg-op .titlewrap{margin-bottom:5mm;}
  .pg-op .sech{font-size:13px;margin-bottom:3mm;}
  .pg-op .sech::before{height:16px;}

  .learned{background:var(--blue-soft);border-radius:6px;padding:4mm 5mm;margin-bottom:6mm;}
  .learned p{font-size:12px;line-height:1.75;color:var(--ink);}
  .learned b{color:var(--blue-deep);}
  .learned .oneline{font-size:13px;font-weight:800;color:var(--blue-deep);margin-bottom:2mm;}

  .compare{display:flex;gap:5mm;margin-bottom:6mm;}
  .col{flex:1;border-radius:6px;padding:4mm 5mm;}
  .col.bad{background:var(--zebra);border:1px solid var(--brown-line);}
  .col.good{background:var(--green-bg);border:1px solid #A9CDB6;}
  .col .ch{font-size:11px;font-weight:800;margin-bottom:2mm;}
  .col.bad .ch{color:var(--ink-soft);}
  .col.good .ch{color:var(--green);}
  .col .ex{font-size:11px;line-height:1.6;color:var(--ink);}
  .col.good .ex b{color:var(--green);}

  .task{background:var(--warm-bg);border:1px solid var(--warm-line);border-radius:6px;padding:4mm 5mm;margin-bottom:5mm;}
  .task .th{font-size:12.5px;font-weight:800;color:var(--warm-ink);margin-bottom:2.5mm;
    display:flex;align-items:center;gap:6px;}
  /* 纯 CSS 色块，勿改回 emoji：彩色 emoji 会被 Chromium 打成 Type3，PDF 编辑器拒编 */
  .task .th::before{content:"";width:10px;height:10px;border-radius:3px;
    background:var(--warm-ink);flex-shrink:0;}
  .task .step{font-size:11.5px;line-height:1.7;color:var(--ink);margin-bottom:1.5mm;padding-left:16px;position:relative;}
  .task .step .n{position:absolute;left:0;color:var(--warm-ink);font-weight:800;}
  .task .step b{color:var(--warm-ink);}
  .task .tip{font-size:10.5px;color:var(--ink-soft);margin-top:2mm;font-style:italic;}

  .dont{border:1.5px dashed var(--brown-line);border-radius:5px;padding:3.5mm 5mm;}
  .dont .dh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;}
  .dont p{font-size:11px;color:var(--ink-soft);line-height:1.6;}
  .dont b{color:var(--brown-deep);}
</style>
</head>
<body>

<!-- ============ 家长一页纸（本侧唯一一页） ============ -->
<div class="sheet pg-op">

  <div class="brandbar">
    <div class="toptag">家长页</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker" id="op-kicker"></div>
    <h1>这节课，孩子学了什么 <span class="light" id="op-topic"></span></h1>
  </div>

  <div class="sech">一句话说清</div>
  <div class="learned">
    <div class="oneline" id="op-oneline"></div>
    <p id="op-para"></p>
  </div>

  <div class="sech">两种写法，比一比</div>
  <div class="compare">
    <div class="col bad">
      <div class="ch">课上要改掉的写法</div>
      <div class="ex" id="op-bad"></div>
    </div>
    <div class="col good">
      <div class="ch">课上要学的写法</div>
      <div class="ex" id="op-good"></div>
    </div>
  </div>

  <div class="task">
    <div class="th" id="op-task-title"></div>
    <div id="op-task-steps"><!-- 步骤由 JS 注入 --></div>
    <div class="tip" id="op-task-tip"></div>
  </div>

  <div class="dont">
    <div class="dh">在家陪的时候，别做这两件事</div>
    <p id="op-dont"></p>
  </div>

</div>

<script>
  const DATA = /*__DATA__*/ null;

  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // 富文本标记：{b}…{/b} → 加粗（各区块有各自强调色）
  function rich(s){return esc(s).replace(/\{b\}/g,'<b>').replace(/\{\/b\}/g,'</b>');}

  const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩';

  function fill(){
    const d=DATA, m=d.meta;
    document.title='家长合订 · '+m.topic;

    /* ---- 家长一页纸 ---- */
    const o=d.onepager;
    document.getElementById('op-kicker').textContent=m.kicker;
    document.getElementById('op-topic').textContent='· '+m.topic;
    document.getElementById('op-oneline').textContent=o.oneline;
    document.getElementById('op-para').innerHTML=rich(o.para);
    document.getElementById('op-bad').innerHTML=rich(o.compare.bad.quote)+'<br><br>——'+rich(o.compare.bad.note);
    document.getElementById('op-good').innerHTML=rich(o.compare.good.quote)+'<br><br>——'+rich(o.compare.good.note);
    document.getElementById('op-task-title').textContent=o.task.title;
    const sbox=document.getElementById('op-task-steps');
    o.task.steps.forEach((t,i)=>{
      const div=document.createElement('div'); div.className='step';
      div.innerHTML='<span class="n">'+(i+1)+'.</span>'+rich(t);
      sbox.appendChild(div);
    });
    document.getElementById('op-task-tip').textContent=o.task.tip;
    document.getElementById('op-dont').innerHTML=
      o.dont.map((t,i)=>(CIRCLED[i]||(i+1)+'.')+' '+rich(t)).join('<br>');
  }

  window.addEventListener('load',()=>{
    fill();
    setTimeout(()=>{ document.body.dataset.rendered='1'; },100);
  });
</script>
</body>
</html>
