<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学生用</title>
<style>
  /* ===== 设计令牌（固定骨架，勿改）===== */
  :root{
    --brand-red:#C8352B;
    --ink:#3A3A38;
    --ink-soft:#7A7568;
    --paper:#FFFFFF;
    --brown-head:#A89B8A;
    --brown-deep:#7D7468;
    --brown-cell:#EFEBE3;
    --brown-line:#C9C0B0;
    --zebra:#F7F5F0;
    --blue-head:#5B7A99;
    --blue-soft:#E7EEF3;
    --blue-line:#AEC2D2;
    --blue-deep:#3E5A73;
    --grid-line:#D8D2C6;
    --note-bg:#FBF3EC;
    --note-line:#D8B99C;
    --note-ink:#9A6A44;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#EDEAE3;}
  @media print{
    html,body{background:#fff;}
    .sheet{box-shadow:none!important;margin:0!important;min-height:auto!important;}
    .sheet.page2,.sheet.page2b{min-height:calc(297mm - 2px)!important;}
    .no-print{display:none;}
  }
  .page-break{ page-break-before:always; }

  body{
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink); line-height:1.6; -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .sheet{
    width:210mm; min-height:297mm; margin:14px auto; background:var(--paper);
    padding:16mm 15mm 14mm; box-shadow:0 2px 18px rgba(0,0,0,.12); position:relative;
  }

  /* ===== 品牌页眉：真 logo（品牌资产\logo.png，渲染脚本 base64 注入，固定骨架勿改）===== */
  .brandbar{display:flex;justify-content:flex-end;align-items:flex-start;margin-bottom:6mm;}
  .logo-img{height:46px;width:auto;display:block;}

  /* ===== 标题区（共用）===== */
  .titlewrap{border-bottom:2.5px solid var(--brown-head);padding-bottom:4mm;margin-bottom:5mm;}
  .kicker{font-size:11px;color:var(--blue-deep);font-weight:700;letter-spacing:2px;margin-bottom:2px;}
  h1{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.5px;}
  h1 .light{color:var(--ink-soft);font-weight:600;font-size:17px;}
  .lead{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.55;}

  /* ===== 页面级间距微调（保持三份原版各自版式）===== */
  .pg-essay .brandbar{margin-bottom:4mm;}
  .pg-essay .titlewrap{padding-bottom:3mm;margin-bottom:4mm;}

  /* ===== 学习单：模块框架 ===== */
  .mod{margin-bottom:6mm;}
  .modhead{display:flex;align-items:center;gap:7px;margin-bottom:3mm;}
  .step{ display:none; }
  .modhead h2{font-size:14.5px;font-weight:800;color:var(--blue-deep);}
  .modhead .hint{font-size:10.5px;color:var(--ink-soft);font-weight:500;margin-left:2px;}

  /* ===== 学习单：构思表 ===== */
  table{width:100%;border-collapse:collapse;font-size:12px;}
  .plan th{
    background:var(--brown-head);color:#fff;font-weight:700;padding:7px 9px;text-align:left;
    font-size:12px;border:1px solid var(--brown-line);
  }
  .plan td{border:1px solid var(--brown-line);padding:0;vertical-align:top;}
  .plan .rowlabel{
    background:var(--brown-cell);font-weight:700;color:var(--brown-deep);padding:9px;width:34%;
    font-size:11.5px;line-height:1.45;
  }
  .plan .rowlabel small{display:block;font-weight:500;color:var(--ink-soft);font-size:10px;margin-top:2px;}
  .plan .fill{height:62px;background:#fff;}  /* 每行书写空间；2026-08-05 由 52px 略调高，5 行表也不至于太空 */
  .plan tr:nth-child(even) .fill{background:var(--zebra);}

  /* ===== 学习单：提纲表（可选第二张表 · 2026-09-07 增）=====
     详案里「先列整篇提纲、再用构思表细化中间」两步走的课（如五上四《二十年后的家乡》）
     需要两张表：本表管全篇框架，构思表管中间段落。由 worksheet.outline_rows 触发，
     不写该字段的课渲染结果与此前一字不变。两表同页时统一走 .compact 压行高。 */
  .plan .fill.prefilled{padding:9px;color:var(--brown-deep);font-size:11.5px;font-weight:600;
    background:var(--brown-cell);}
  .compact .plan .fill{height:52px;}
  .compact .mod{margin-bottom:5mm;}
  .compact .modhead{margin-bottom:2.5mm;}
  .plan.multicol .rowlabel{width:10%;text-align:center;padding:9px 4px;}  /* 只作用于多列那张表 */

  .draftnote{font-size:10.5px;color:var(--ink-soft);margin-bottom:2mm;}

  /* ===== 姓名栏（固定骨架，勿改）=====
     批改工具按固定位置定位这一行来归属作业，勿移动、勿改三栏顺序。
     ⚠ 必须与 h1 同行（.titlerow 内），不可拆成独立一行——独立成行会吃掉一行格子
     （实测一行 16 字），且须同步计入 buildGrid() 的 used 列表。现挂在 .titlewrap 内，
     高度已随 .titlewrap 一并计入，buildGrid 不需要单列。 */
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:8mm;}
  .namebar{display:flex;gap:6mm;font-size:12px;color:var(--brown-deep);flex:0 0 88mm;}
  .namebar span{display:flex;align-items:baseline;gap:1.5mm;flex:1;white-space:nowrap;}
  .namebar i{flex:1;border-bottom:1px solid var(--brown-line);height:1em;}

  /* ===== 格子稿纸（固定骨架，勿改）：中格子 + 右批改栏（字数刻度挂在批改栏左缘，2026-09-07 由左侧挪入）===== */
  .writezone{display:flex;align-items:stretch;gap:0;margin-bottom:2mm;}
  .scale{position:absolute;left:0;top:0;bottom:0;width:100%;pointer-events:none;}
  .scale .tick{position:absolute;left:9px;font-size:9px;color:var(--blue-deep);font-weight:700;
    white-space:nowrap;transform:translateY(-50%);}
  .scale .tickline{position:absolute;left:0;width:6px;height:0;border-top:1.5px solid var(--blue-head);}
  .gridwrap{flex:0 0 87.5%;}  /* 2026-09-07：原 82% 放 15 格 + 左刻度列 34px；刻度并入右栏后 16 格同尺寸 */
  .grid{display:grid;grid-template-columns:repeat(16,1fr);gap:0;border:1.5px solid var(--blue-line);
    overflow:hidden;}
  .grid .cell{aspect-ratio:1/1;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);}
  .grid .cell:nth-child(16n){border-right:none;}
  .writezone .grid{border-radius:3px 0 0 3px;}
  .correctcol{flex:1;position:relative;border:1.5px solid var(--blue-line);border-left:none;border-radius:0 3px 3px 0;
    padding:3mm 2mm 0;display:flex;align-items:flex-start;justify-content:center;background:#FCFBF9;}
  .correctcol .label{font-size:10px;color:var(--brown-deep);letter-spacing:1px;
    font-weight:600;text-align:center;}

  /* 学习单第二页：flex 列（修改符号表 2026-09-07 已删，稿纸页只剩格子）*/
  .sheet.page2,.sheet.page2b{display:flex;flex-direction:column;}
  /* 续页（备用稿纸，固定骨架，勿改）：不带起笔提示，故格子行数比第 1 页多 */


  /* ===== 底部能力点条（共用）===== */
  .footer-skill{
    border-top:1.5px dashed var(--brown-line);padding-top:3.5mm;margin-top:5mm;
    display:flex;align-items:flex-start;gap:8px;
  }
  .footer-skill .badge{background:var(--brown-deep);color:#fff;font-size:9.5px;font-weight:700;
    padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
  .footer-skill p{font-size:11px;color:var(--ink-soft);line-height:1.55;}
  .footer-skill b{color:var(--ink);}

  /* ===== 范文页：范文 + 批注双栏 ===== */
  .essaywrap{display:flex;gap:5mm;margin-bottom:4mm;}
  .essay{flex:0 0 62%;}
  .essay .paper{border:1.5px solid var(--brown-line);border-radius:4px;padding:5mm 6mm;background:#FEFDFB;}
  .essay .ptitle{font-size:15px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:4mm;}
  .essay p{font-size:12px;line-height:1.8;text-indent:2em;margin-bottom:0.5mm;color:var(--ink);}
  .essay .hl{background:linear-gradient(transparent 60%, #FBE6D2 60%);padding:0 1px;}
  .essay .tag-teacher{font-size:10px;color:var(--ink-soft);text-align:right;margin-top:3mm;font-style:italic;}

  .notes{flex:1;display:flex;flex-direction:column;gap:3mm;}
  .notes-title{font-size:12px;font-weight:800;color:var(--note-ink);margin-bottom:1mm;
    display:flex;align-items:center;gap:5px;}
  /* 纯 CSS 色块，勿改回 emoji/符号字符：彩色 emoji 会被 Chromium 打成 Type3，PDF 编辑器拒编 */
  .notes-title::before{content:"";width:9px;height:9px;border-radius:2px;
    background:var(--note-ink);flex-shrink:0;}
  .note{background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:0 4px 4px 0;
    padding:2.5mm 3mm;}
  .note .q{font-size:10.5px;color:var(--note-ink);font-weight:700;margin-bottom:1mm;line-height:1.4;}
  .note .a{font-size:10.5px;color:var(--ink);line-height:1.5;}
  .note .a b{color:var(--brown-deep);}

  .method{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:5px;padding:3mm 5mm;margin-bottom:4mm;}
  .method h3{font-size:12.5px;font-weight:800;color:var(--blue-deep);margin-bottom:2mm;}
  .method p{font-size:11.5px;color:var(--ink);line-height:1.7;}
  .method b{color:var(--blue-deep);}

</style>
</head>
<body>

<!-- ============ 第 1 页：写作学习单 · 构思表 ============ -->
<div class="sheet pg-ws1">

  <div class="brandbar">
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker js-kicker"></div>
    <h1>写作学习单 <span class="light js-topic"></span></h1>
    <p class="lead" id="ws-lead"></p>
  </div>

  <!-- 提纲表：仅当 worksheet.outline_rows 存在时显示（2026-09-07 增，可选区块） -->
  <div class="mod" id="mod-outline" style="display:none">
    <div class="modhead">
      <span class="step">1</span>
      <h2 id="outline-title">搭框架 · 写作提纲</h2>
      <span class="hint" id="outline-hint"></span>
    </div>
    <table class="plan">
      <tbody id="outline-body">
        <tr><th style="width:34%">哪一部分</th><th id="outline-th2">写什么</th></tr>
      </tbody>
    </table>
  </div>

  <div class="mod">
    <div class="modhead">
      <span class="step">1</span>
      <h2 id="plan-title">理思路 · 构思表</h2>
      <span class="hint">每格只填关键词，3 分钟填完</span>
    </div>
    <table class="plan">
      <tbody id="plan-body">
        <tr id="plan-head"><th style="width:34%">想清楚这一步</th><th>写下你的关键词</th></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-skill">
    <span class="badge">这一课在练</span>
    <p id="ws-skills"></p>
  </div>

</div>

<!-- ============ 第 2 页：写作学习单 · 格子稿纸 ============ -->
<div class="sheet page-break page2">

  <div class="brandbar">
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap" style="border-bottom-width:2px;padding-bottom:3mm;margin-bottom:5mm;">
    <div class="titlerow">
      <h1 style="font-size:19px;">写作稿纸 <span class="light js-topic"></span></h1>
      <div class="namebar">
        <span>姓名<i></i></span>
        <span>班级<i></i></span>
        <span>日期<i></i></span>
      </div>
    </div>
    <p class="lead" id="ws2-lead"></p>
  </div>

  <div class="mod">
    <div class="modhead">
      <span class="step">2</span>
      <h2>写下来 · 格子稿纸</h2>
      <span class="hint" id="ws2-planref">照第一页的构思表，一样一样写</span>
    </div>
    <p class="draftnote" id="ws-draftnote"></p>
    <div class="writezone">
      <div class="gridwrap"><div class="grid" id="grid"></div></div>
      <div class="correctcol"><span class="label">老师批改</span><div class="scale" id="scale"></div></div>
    </div>
  </div>


</div>

<!-- ============ 第 3 页：写作稿纸 · 续页（备用，写不下时接着用） ============ -->
<div class="sheet page-break page2b">

  <div class="brandbar">
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap" style="border-bottom-width:2px;padding-bottom:3mm;margin-bottom:5mm;">
    <div class="titlerow">
      <h1 style="font-size:19px;">写作稿纸 · 续页 <span class="light js-topic"></span></h1>
      <div class="namebar">
        <span>姓名<i></i></span>
        <span>班级<i></i></span>
        <span>日期<i></i></span>
      </div>
    </div>
  </div>


  <div class="writezone">
    <div class="gridwrap"><div class="grid" id="grid2"></div></div>
    <div class="correctcol"><span class="label">老师批改</span><div class="scale" id="scale2"></div></div>
  </div>

</div>

<!-- ============ 第 4 页：范文页 ============ -->
<div class="sheet page-break pg-essay">

  <div class="brandbar">
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰深度阅读" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker js-kicker"></div>
    <h1>范文页 <span class="light js-topic"></span></h1>
    <p class="lead" id="es-lead"></p>
  </div>

  <div class="essaywrap">
    <div class="essay">
      <div class="paper" id="es-paper">
        <div class="ptitle" id="es-title"></div>
        <!-- 段落由 JS 注入 -->
        <div class="tag-teacher">—— 教师示范文</div>
      </div>
    </div>

    <div class="notes" id="es-notes">
      <div class="notes-title">看老师用了什么办法</div>
      <!-- 旁批卡由 JS 注入 -->
    </div>
  </div>

  <div class="method">
    <h3>一句话记住</h3>
    <p id="es-method"></p>
  </div>

  <div class="footer-skill">
    <span class="badge">读范文是为了</span>
    <p id="es-footer"></p>
  </div>

</div>

<script>
  const DATA = /*__DATA__*/ null;

  /* ---------- 文本工具：先转义再解富文本标记 ---------- */
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // 富文本标记：{hl}…{/hl} → 荧光高亮；{b}…{/b} → 加粗
  function rich(s){return esc(s)
    .replace(/\{hl\}/g,'<span class="hl">').replace(/\{\/hl\}/g,'</span>')
    .replace(/\{b\}/g,'<b>').replace(/\{\/b\}/g,'</b>');}

  /* ---------- 数据填充 ---------- */
  function fill(){
    const d=DATA, m=d.meta;
    document.title='学生用 · '+m.topic;
    document.querySelectorAll('.js-kicker').forEach(e=>e.textContent=m.kicker);
    document.querySelectorAll('.js-topic').forEach(e=>e.textContent='· '+m.topic);

    /* 学习单 */
    const w=d.worksheet;
    document.getElementById('ws-lead').textContent=w.lead;
    /* 行渲染：label 列 + 若干书写格。cells 为多列表（本课三列构思表）逐格给值，
       缺省仍是单格，既有课次渲染结果不变。 */
    const planRow=r=>{
      const tr=document.createElement('tr');
      const lab='<td class="rowlabel">'+esc(r.label)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</td>';
      const cell=v=>v?'<td class="fill prefilled">'+esc(v)+'</td>':'<td class="fill"></td>';
      const body=Array.isArray(r.cells)?r.cells.map(cell).join('')
                :r.prefill?'<td class="fill" style="padding:9px;color:var(--ink-soft);font-size:11.5px">'+esc(r.prefill)+'</td>'
                :'<td class="fill"></td>';
      tr.innerHTML=lab+body;
      return tr;
    };
    /* 提纲表（可选）：有 outline_rows 才出，两表同页时整页压行高 */
    if(w.outline_rows && w.outline_rows.length){
      document.getElementById('mod-outline').style.display='';
      document.querySelector('.pg-ws1').classList.add('compact');
      if(w.outline_hint) document.getElementById('outline-hint').textContent=w.outline_hint;
      const ob=document.getElementById('outline-body');
      w.outline_rows.forEach(r=>ob.appendChild(planRow(r)));
    }
    const tbody=document.getElementById('plan-body');
    /* 构思表表头：plan_cols 可覆盖成多列（缺省＝想清楚这一步/写下你的关键词） */
    if(Array.isArray(w.plan_cols) && w.plan_cols.length){
      const w0=w.plan_cols.length>2?'10%':'34%';   /* 多列表首列只放序号，让出书写宽度 */
      document.getElementById('plan-head').innerHTML=
        w.plan_cols.map((c,i)=>'<th'+(i===0?' style="width:'+w0+'"':'')+'>'+esc(c)+'</th>').join('');
      if(w.plan_cols.length>2) tbody.parentElement.classList.add('multicol');
    }
    w.plan_rows.forEach(r=>tbody.appendChild(planRow(r)));
    document.getElementById('ws-skills').innerHTML=rich(w.skills);
    /* plan_name：该课在详案里给这张表起的专名（如「人物特点卡」）。
       不传＝沿用通用栏目名「构思表」，存量课次零影响。
       学生手上印的名字必须和教师口头说的一致，否则学生对不上号。 */
    if(w.plan_name){
      document.getElementById('plan-title').textContent='理思路 · '+w.plan_name;
      document.getElementById('ws2-planref').textContent='照第一页的'+w.plan_name+'，一样一样写';
    }
    document.getElementById('ws2-lead').textContent=w.page2_lead;
    document.getElementById('ws-draftnote').textContent=w.draftnote;
    // worksheet.marks 已废弃（2026-09-07 稿纸页删修改符号表），存量 data.json 里的字段忽略

    /* 范文页 */
    const e=d.essay;
    document.getElementById('es-lead').textContent=e.lead;
    document.getElementById('es-title').textContent=e.title;
    const paper=document.getElementById('es-paper');
    const tail=paper.querySelector('.tag-teacher');
    e.paragraphs.forEach(t=>{
      const p=document.createElement('p'); p.innerHTML=rich(t);
      paper.insertBefore(p,tail);
    });
    const notes=document.getElementById('es-notes');
    e.notes.forEach(n=>{
      const div=document.createElement('div'); div.className='note';
      div.innerHTML='<div class="q">'+esc(n.q)+'</div><div class="a">'+rich(n.a)+'</div>';
      notes.appendChild(div);
    });
    document.getElementById('es-method').innerHTML=rich(e.method);
    /* footer 为空时整块隐藏（含“读范文是为了”标签）：示范文较长的课次用它腾版面 */
    if(e.footer && e.footer.trim()){
      document.getElementById('es-footer').innerHTML=rich(e.footer);
    }else{
      document.getElementById('es-footer').closest('.footer-skill').style.display='none';
    }
  }

  /* ---------- 格子稿纸（固定骨架版式，勿改逻辑）----------
     两页稿纸共用本函数：第 1 页（.page2）带起笔提示；
     第 2 页（.page2b）是备用续页、只有格子，故可用高度更大、行数更多。
     startCount = 前面各页累计格数，续页的字数刻度据此接着往下标（不从 100 重来）。
     ⚠ usedSels 必须列全该页里挤占格子高度的元素，漏一个就会算多行、页面溢出；
       末尾的收敛环只是兜底，别指望它——每减一行都要整页重排一次。 */
  function buildGridOn(sheetSel, gridSel, scaleSel, usedSels, startCount){
    const cols=16;
    const sheet=document.querySelector(sheetSel);
    if(!sheet) return 0;
    const grid=sheet.querySelector(gridSel);
    const scale=sheet.querySelector(scaleSel);
    const gwEl=sheet.querySelector('.gridwrap');
    const cw=gwEl.clientWidth;
    const cellSize=(cw-3)/cols;
    const sheetStyle=getComputedStyle(sheet);
    const sheetInner=sheet.clientHeight - parseFloat(sheetStyle.paddingTop) - parseFloat(sheetStyle.paddingBottom);
    let used=0;
    usedSels.forEach(sel=>{
      const el=sheet.querySelector(sel); if(el) used+=el.getBoundingClientRect().height;
    });
    used += 110; // 各元素 margin 余量
    const avail=sheetInner - used;
    let rows=Math.max(5, Math.floor(avail/cellSize));

    function renderRows(n){
      grid.innerHTML='';
      for(let i=0;i<cols*n;i++){const c=document.createElement('div');c.className='cell';grid.appendChild(c);}
      // 刻度：每行16字（2026-09-07 由 18 改 15 再改 16：左刻度列并入格子区多放一格），标在累计字数最接近100/200/300…的行末；续页接着上一页的字数往后标
      scale.innerHTML='';
      const border=1.5;
      const firstHundred=Math.floor(startCount/100)*100+100;
      const maxHundred=Math.floor((startCount+n*cols)/100)*100;
      for(let h=firstHundred;h<=maxHundred;h+=100){
        let bestRow=Math.round((h-startCount)/cols);
        if(bestRow<1)bestRow=1; if(bestRow>n)bestRow=n;
        const y=border+bestRow*cellSize;
        const line=document.createElement('div');line.className='tickline';line.style.top=y+'px';
        const tick=document.createElement('div');tick.className='tick';tick.style.top=y+'px';tick.textContent=h+'字';
        scale.appendChild(line);scale.appendChild(tick);
      }
    }

    renderRows(rows);
    // 收敛环：估算余量不够精确时（导语/起笔提示行数因课而异），实测超一页高就减行重排
    const A4_H=1123; // 297mm @96dpi
    while(rows>5 && sheet.offsetHeight>A4_H){ rows--; renderRows(rows); }
    // 反向试探（2026-09-07 加）：余量估算偏保守时再往上加行，装得下就多一行、装不下回退
    while(rows<40){ renderRows(rows+1); if(sheet.offsetHeight>A4_H){ renderRows(rows); break; } rows++; }
    return rows*cols;
  }

  function buildGrid(){
    const p1=buildGridOn('.sheet.page2','#grid','#scale',
                         ['.brandbar','.titlewrap','.draftnote','.mod .modhead'],0);
    buildGridOn('.sheet.page2b','#grid2','#scale2',
                ['.brandbar','.titlewrap'],p1);
  }

  window.addEventListener('load',()=>{
    fill();
    setTimeout(()=>{
      buildGrid();
      document.body.dataset.rendered='1';
    },150);
  });
</script>
</body>
</html>
