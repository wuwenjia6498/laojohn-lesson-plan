<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>教师家长页</title>
<style>
  /* ===== 设计令牌（对齐同步写作配套，固定骨架勿改）===== */
  :root{
    --brand-red:#C8352B;--ink:#3A3A38;--ink-soft:#7A7568;--paper:#FFFFFF;
    --brown-head:#A89B8A;--brown-deep:#7D7468;--brown-cell:#EFEBE3;--brown-line:#C9C0B0;--zebra:#F7F5F0;
    --blue-head:#5B7A99;--blue-soft:#E7EEF3;--blue-line:#AEC2D2;--blue-deep:#3E5A73;
    --warm-bg:#FBF3EC;--warm-line:#D8B99C;--warm-ink:#9A6A44;
    --green:#3E7D5A;--green-bg:#E8F2EC;--green-line:#A9CDB6;
  }
  @page{ size:A4; margin:0; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#EDEAE3;}
  @media print{ html,body{background:#fff;} .sheet{box-shadow:none!important;margin:0!important;min-height:auto!important;} }
  .page-break{ page-break-before:always; }
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sheet{width:210mm;min-height:297mm;margin:14px auto;background:var(--paper);
    padding:14mm 15mm 12mm;box-shadow:0 2px 18px rgba(0,0,0,.12);position:relative;}

  .brandbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4mm;}
  .toptag{font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;margin-top:6px;}
  .logo-img{height:42px;width:auto;display:block;}
  .titlewrap{border-bottom:2.5px solid var(--brown-head);padding-bottom:3mm;margin-bottom:4mm;}
  .kicker{font-size:10.5px;color:var(--blue-deep);font-weight:700;letter-spacing:2px;margin-bottom:2px;}
  h1{font-size:20px;font-weight:800;color:var(--ink);}
  h1 .light{color:var(--ink-soft);font-weight:600;font-size:15px;}
  .sech{font-size:12px;font-weight:800;color:var(--blue-deep);margin:0 0 2.5mm;
    display:flex;align-items:center;gap:6px;}
  .sech::before{content:"";width:4px;height:14px;background:var(--blue-head);border-radius:2px;}

  /* ===== 教师速览：目标条 ===== */
  .goal{background:var(--blue-soft);border-radius:5px;padding:3mm 4mm;margin-bottom:4mm;
    font-size:11.5px;line-height:1.65;color:var(--ink);}
  .goal b{color:var(--blue-deep);}

  /* ===== 教师速览：时间轴 ===== */
  .timeline{display:flex;gap:5mm;margin-bottom:4mm;}
  .lesson{flex:1;}
  .lesson .lh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;
    padding-bottom:1.5mm;border-bottom:1px solid var(--brown-line);}
  .step{display:flex;align-items:baseline;gap:6px;font-size:10.8px;margin-bottom:1.5mm;line-height:1.4;}
  .step .min{background:var(--brown-cell);color:var(--brown-deep);font-weight:700;font-size:9.5px;
    padding:1px 5px;border-radius:8px;flex-shrink:0;min-width:34px;text-align:center;}
  .step .name{color:var(--ink);}

  /* ===== 教师速览：过关判定表 ===== */
  table.pass{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:4mm;}
  table.pass th{background:var(--brown-head);color:#fff;font-weight:700;padding:4px 7px;text-align:left;
    border:1px solid var(--brown-line);}
  table.pass td{border:1px solid var(--brown-line);padding:4px 7px;vertical-align:top;line-height:1.45;}
  table.pass tr:nth-child(even) td{background:var(--zebra);}
  table.pass .vd{font-weight:700;white-space:nowrap;width:20%;}
  table.pass .vd.ok{color:var(--green);}
  table.pass .vd.no{color:var(--ink-soft);}
  table.pass .vd.plus{color:var(--brand-red);}

  /* ===== 教师速览：评价三级 ===== */
  .levels{display:flex;gap:4mm;margin-bottom:4mm;}
  .lv{flex:1;border-radius:5px;padding:2.5mm 3.5mm;font-size:10.3px;line-height:1.5;}
  .lv .ln{font-weight:800;margin-bottom:1mm;}
  .lv.base{background:var(--zebra);border:1px solid var(--brown-line);}
  .lv.base .ln{color:var(--brown-deep);}
  .lv.good{background:var(--blue-soft);border:1px solid var(--blue-line);}
  .lv.good .ln{color:var(--blue-deep);}
  .lv.best{background:var(--green-bg);border:1px solid var(--green-line);}
  .lv.best .ln{color:var(--green);}

  /* ===== 教师速览：示范文 ===== */
  .essaybox{border:1.5px solid var(--brown-line);border-radius:5px;padding:4mm 5mm;margin-bottom:4mm;background:#FEFDFB;}
  .essaybox .et{font-size:11.5px;font-weight:800;text-align:center;margin-bottom:2mm;color:var(--ink);}
  .essaybox p{font-size:10.3px;line-height:1.65;text-indent:2em;margin-bottom:1mm;color:var(--ink);}

  /* ===== 教师速览：物料清单 ===== */
  .materials{background:var(--zebra);border:1px solid var(--brown-line);border-radius:5px;padding:3mm 4mm;}
  .materials .mh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;}
  .mlist{display:flex;flex-wrap:wrap;gap:2mm 4mm;}
  .mlist .m{font-size:10.5px;color:var(--ink);display:flex;align-items:center;gap:5px;}
  .mlist .m .chk{width:11px;height:11px;border:1.5px solid var(--brown-line);border-radius:2px;flex-shrink:0;}

  /* ===== 家长一页纸 ===== */
  .pg-op{line-height:1.6;}
  .learned{background:var(--blue-soft);border-radius:6px;padding:4mm 5mm;margin-bottom:6mm;}
  .learned .oneline{font-size:13px;font-weight:800;color:var(--blue-deep);margin-bottom:2mm;}
  .learned p{font-size:12px;line-height:1.75;color:var(--ink);}
  .learned b{color:var(--blue-deep);}

  .compare{display:flex;gap:5mm;margin-bottom:6mm;}
  .col{flex:1;border-radius:6px;padding:4mm 5mm;}
  .col.bad{background:var(--zebra);border:1px solid var(--brown-line);}
  .col.good{background:var(--green-bg);border:1px solid var(--green-line);}
  .col .ch{font-size:11px;font-weight:800;margin-bottom:2mm;}
  .col.bad .ch{color:var(--ink-soft);} .col.good .ch{color:var(--green);}
  .col .ex{font-size:11px;line-height:1.6;color:var(--ink);}
  .col.good .ex b{color:var(--green);}

  .task{background:var(--warm-bg);border:1px solid var(--warm-line);border-radius:6px;padding:4mm 5mm;margin-bottom:5mm;}
  .task .th{font-size:12.5px;font-weight:800;color:var(--warm-ink);margin-bottom:2.5mm;
    display:flex;align-items:center;gap:6px;}
  /* 纯 CSS 色块，勿改回 emoji：彩色 emoji 会被 Chromium 打成 Type3，PDF 编辑器拒编 */
  .task .th::before{content:"";width:10px;height:10px;border-radius:3px;
    background:var(--warm-ink);flex-shrink:0;}
  .task .stp{font-size:11.5px;line-height:1.7;color:var(--ink);margin-bottom:1.5mm;padding-left:16px;position:relative;}
  .task .stp .n{position:absolute;left:0;color:var(--warm-ink);font-weight:800;}
  .task .stp b{color:var(--warm-ink);}
  .task .tip{font-size:10.5px;color:var(--ink-soft);margin-top:2mm;font-style:italic;}

  .dont{border:1.5px dashed var(--brown-line);border-radius:5px;padding:3.5mm 5mm;}
  .dont .dh{font-size:11px;font-weight:800;color:var(--brown-deep);margin-bottom:2mm;}
  .dont p{font-size:11px;color:var(--ink-soft);line-height:1.6;}
  .dont b{color:var(--brown-deep);}
</style>
</head>
<body>

<!-- ============ 第 1 页：教师速览 ============ -->
<div class="sheet pg-ov">
  <div class="brandbar">
    <div class="toptag">教师速览 · 上课前扫一遍</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰·看图写话" onerror="this.style.display='none'">
  </div>
  <div class="titlewrap">
    <div class="kicker" id="ov-kicker"></div>
    <h1><span id="ov-topic"></span> <span class="light" id="ov-genre"></span></h1>
  </div>

  <div class="goal"><b>一句话目标：</b><span id="ov-goal"></span></div>

  <div class="sech">两节课时间轴</div>
  <div class="timeline" id="ov-timeline"></div>

  <div class="sech" id="ov-pass-title">过关判定</div>
  <table class="pass"><tbody id="ov-pass"></tbody></table>

  <div class="sech">评价三级</div>
  <div class="levels" id="ov-levels"></div>

  <div class="sech">教师示范例文（可投屏 / 照念）</div>
  <div class="essaybox">
    <div class="et" id="ov-essay-title"></div>
    <div id="ov-essay"></div>
  </div>

  <div class="materials">
    <div class="mh">这一课要发 / 用的物料</div>
    <div class="mlist" id="ov-materials"></div>
  </div>
</div>

<!-- ============ 第 2 页：家长一页纸 ============ -->
<div class="sheet page-break pg-op">
  <div class="brandbar">
    <div class="toptag">家长一页纸 · 把课堂延伸到家里</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰·看图写话" onerror="this.style.display='none'">
  </div>
  <div class="titlewrap">
    <div class="kicker" id="op-kicker"></div>
    <h1>这节课，孩子学了什么 <span class="light" id="op-topic"></span></h1>
  </div>

  <div class="sech">一句话说清</div>
  <div class="learned">
    <div class="oneline" id="op-oneline"></div>
    <p id="op-para"></p>
  </div>

  <div class="sech">一眼看懂差别</div>
  <div class="compare">
    <div class="col bad">
      <div class="ch" id="op-bad-h"></div>
      <div class="ex" id="op-bad"></div>
    </div>
    <div class="col good">
      <div class="ch" id="op-good-h"></div>
      <div class="ex" id="op-good"></div>
    </div>
  </div>

  <div class="task">
    <div class="th" id="op-task-title"></div>
    <div id="op-task-steps"></div>
    <div class="tip" id="op-task-tip"></div>
  </div>

  <div class="dont">
    <div class="dh">帮忙时，请避开这两件</div>
    <p id="op-dont"></p>
  </div>
</div>

<script>
  const DATA = /*__DATA__*/ null;
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function rich(s){return esc(s).replace(/\{b\}/g,'<b>').replace(/\{\/b\}/g,'</b>');}
  const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩';
  const VD={'不算过关':'no','算过关':'ok','加分':'plus'};

  function fill(){
    const d=DATA, m=d.meta;
    document.title='教师家长页 · '+m.topic;

    /* ---- 教师速览 ---- */
    const t=d.teacher;
    document.getElementById('ov-kicker').textContent=m.kicker+'　｜　2 节 × 45 分钟连排';
    document.getElementById('ov-topic').textContent=m.topic;
    document.getElementById('ov-genre').textContent='· '+m.genre;
    document.getElementById('ov-goal').innerHTML=rich(t.goal);
    document.getElementById('ov-pass-title').textContent=t.pass_title||'怎么算过关了（过关判定）';

    const tl=document.getElementById('ov-timeline');
    t.lessons.forEach(les=>{
      const box=document.createElement('div'); box.className='lesson';
      let html='<div class="lh">'+esc(les.title)+'</div>';
      les.steps.forEach(s=>{ html+='<div class="step"><span class="min">'+esc(s.min)+
        '</span><span class="name">'+esc(s.name)+'</span></div>'; });
      box.innerHTML=html; tl.appendChild(box);
    });

    const pb=document.getElementById('ov-pass');
    pb.innerHTML='<tr><th class="vd">判定</th><th>例句</th><th style="width:34%">说明</th></tr>';
    t.pass_table.forEach(r=>{
      const cls=VD[r.verdict]||'';
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="vd '+cls+'">'+esc(r.verdict)+'</td><td>'+esc(r.example)+
        '</td><td>'+esc(r.note)+'</td>';
      pb.appendChild(tr);
    });

    const lv=document.getElementById('ov-levels');
    const LVC=['base','good','best'];
    t.eval_levels.forEach((e,i)=>{
      const div=document.createElement('div'); div.className='lv '+(LVC[i]||'base');
      div.innerHTML='<div class="ln">'+esc(e.level)+'</div>'+esc(e.desc);
      lv.appendChild(div);
    });

    document.getElementById('ov-essay-title').textContent=t.essay.title;
    const eb=document.getElementById('ov-essay');
    t.essay.paragraphs.forEach(p=>{ const el=document.createElement('p'); el.textContent=p; eb.appendChild(el); });

    const mb=document.getElementById('ov-materials');
    t.materials.forEach(x=>{ const div=document.createElement('div'); div.className='m';
      div.innerHTML='<span class="chk"></span>'+esc(x); mb.appendChild(div); });

    /* ---- 家长一页纸 ---- */
    const p=d.parent;
    document.getElementById('op-kicker').textContent=m.kicker;
    document.getElementById('op-topic').textContent='· '+m.topic;
    document.getElementById('op-oneline').textContent=p.oneline;
    document.getElementById('op-para').innerHTML=rich(p.para);
    document.getElementById('op-bad-h').textContent=p.compare.bad.head||'只写完整的一句';
    document.getElementById('op-good-h').textContent=p.compare.good.head||'加了细节的一段';
    document.getElementById('op-bad').innerHTML=rich(p.compare.bad.quote)+'<br><br>——'+rich(p.compare.bad.note);
    document.getElementById('op-good').innerHTML=rich(p.compare.good.quote)+'<br><br>——'+rich(p.compare.good.note);
    document.getElementById('op-task-title').textContent=p.task.title;
    const sb=document.getElementById('op-task-steps');
    p.task.steps.forEach((x,i)=>{ const div=document.createElement('div'); div.className='stp';
      div.innerHTML='<span class="n">'+(i+1)+'.</span>'+rich(x); sb.appendChild(div); });
    document.getElementById('op-task-tip').textContent=p.task.tip||'';
    document.getElementById('op-dont').innerHTML=
      p.dont.map((x,i)=>(CIRCLED[i]||(i+1)+'.')+' '+rich(x)).join('<br>');
  }

  window.addEventListener('load',()=>{
    fill();
    setTimeout(()=>{ document.body.dataset.rendered='1'; },100);
  });
</script>
</body>
</html>
