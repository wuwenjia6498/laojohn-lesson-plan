<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>看图写话稿纸</title>
<style>
  /* ===== 设计令牌（对齐同步写作配套，固定骨架勿改）===== */
  :root{
    --brand-red:#C8352B;--ink:#3A3A38;--ink-soft:#7A7568;--paper:#FFFFFF;
    --brown-head:#A89B8A;--brown-deep:#7D7468;--brown-cell:#EFEBE3;--brown-line:#C9C0B0;--zebra:#F7F5F0;
    --blue-head:#5B7A99;--blue-soft:#E7EEF3;--blue-line:#AEC2D2;--blue-deep:#3E5A73;
    --grid-line:#D8D2C6;--note-bg:#FBF3EC;--note-line:#D8B99C;--note-ink:#9A6A44;
  }
  @page{ size:A4; margin:0; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#EDEAE3;}
  @media print{ html,body{background:#fff;} .sheet{box-shadow:none!important;margin:0!important;min-height:auto!important;} }
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sheet{width:210mm;min-height:297mm;margin:14px auto;background:var(--paper);
    padding:14mm 15mm 12mm;box-shadow:0 2px 18px rgba(0,0,0,.12);position:relative;
    display:flex;flex-direction:column;}

  /* ===== 品牌页眉 ===== */
  .brandbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3mm;}
  .toptag{font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;margin-top:5px;}
  .logo-img{height:40px;width:auto;display:block;}
  .titlewrap{border-bottom:2.5px solid var(--brown-head);padding-bottom:3mm;margin-bottom:4mm;}
  .kicker{font-size:11px;color:var(--blue-deep);font-weight:700;letter-spacing:2px;margin-bottom:2px;}
  h1{font-size:20px;font-weight:800;color:var(--ink);}
  h1 .light{color:var(--ink-soft);font-weight:600;font-size:15px;}
  .lead{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.55;}

  /* ===== 姓名条 ===== */
  .namebar{display:flex;gap:8mm;font-size:11px;color:var(--ink-soft);margin-bottom:3.5mm;}
  .namebar .un{border-bottom:1px solid var(--brown-line);min-width:56px;display:inline-block;}

  /* ===== 本课图框 ===== */
  .imgbox{border:1.5px solid var(--blue-line);border-radius:5px;background:#FCFBF9;
    margin-bottom:3.5mm;padding:3mm;display:flex;align-items:center;justify-content:center;
    max-height:62mm;overflow:hidden;position:relative;}
  .imgbox .anchor{max-width:100%;max-height:56mm;object-fit:contain;border-radius:3px;display:block;}
  .imgbox .anchor-ph{display:none;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:11px;line-height:1.7;text-align:center;height:44mm;width:100%;}
  .imgbox .anchor-ph b{color:var(--brown-deep);font-size:12px;margin-bottom:2mm;}

  /* ===== 模块标题 ===== */
  .modhead{display:flex;align-items:center;gap:7px;margin-bottom:2.5mm;}
  .modhead h2{font-size:13.5px;font-weight:800;color:var(--blue-deep);}
  .modhead .hint{font-size:10.5px;color:var(--ink-soft);}

  /* ===== 格子稿纸（骨架同步写作单一源，勿改逻辑）：左刻度 + 中格子 + 右批改栏 ===== */
  .writezone{display:flex;align-items:stretch;gap:0;margin-bottom:2mm;}
  .scale{width:34px;flex-shrink:0;position:relative;}
  .scale .tick{position:absolute;right:4px;font-size:9px;color:var(--blue-deep);font-weight:700;
    white-space:nowrap;transform:translateY(-50%);}
  .scale .tickline{position:absolute;right:0;width:6px;height:0;border-top:1.5px solid var(--blue-head);}
  .gridwrap{flex:0 0 82%;}
  .grid{display:grid;grid-template-columns:repeat(18,1fr);gap:0;border:1.5px solid var(--blue-line);
    overflow:hidden;border-radius:3px 0 0 3px;}
  .grid .cell{aspect-ratio:1/1;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);}
  .grid .cell:nth-child(18n){border-right:none;}
  .correctcol{flex:1;border:1.5px solid var(--blue-line);border-left:none;border-radius:0 3px 3px 0;
    padding:3mm 2mm 0;display:flex;align-items:flex-start;justify-content:center;background:#FCFBF9;}
  .correctcol .label{font-size:10px;color:var(--brown-deep);letter-spacing:1px;font-weight:600;text-align:center;}

  /* ===== 写话格式小提醒（底部）===== */
  .tips{margin-top:auto;background:var(--note-bg);border-left:3px solid var(--note-line);
    border-radius:0 5px 5px 0;padding:3.5mm 5mm;}
  .tips .th{font-size:11.5px;font-weight:800;color:var(--note-ink);margin-bottom:2mm;}
  .tips .tlist{display:flex;flex-wrap:wrap;gap:1.5mm 6mm;}
  .tips .t{font-size:11px;color:var(--ink);line-height:1.5;position:relative;padding-left:13px;}
  .tips .t::before{content:"·";position:absolute;left:3px;color:var(--note-ink);font-weight:800;}
</style>
</head>
<body>

<div class="sheet">
  <div class="brandbar">
    <div class="toptag">看图写话稿纸 · 每人一张</div>
    <img class="logo-img" src="__LOGO_SRC__" alt="老约翰·看图写话" onerror="this.style.display='none'">
  </div>

  <div class="titlewrap">
    <div class="kicker" id="kicker"></div>
    <h1>看图写话稿纸 <span class="light" id="topic"></span></h1>
    <p class="lead" id="lead"></p>
  </div>

  <div class="namebar">
    <span>姓名 <span class="un"></span></span>
    <span>日期 <span class="un"></span></span>
  </div>

  <div class="imgbox">
    <img class="anchor" id="anchor-img" src="__ANCHOR_SRC__" alt="本课图"
      onerror="this.style.display='none';document.getElementById('anchor-ph').style.display='flex';">
    <div class="anchor-ph" id="anchor-ph"><b>本课图</b>老师另发打印图，贴在这个框里再写</div>
  </div>

  <div class="modhead">
    <h2>看着图，写一段</h2>
    <span class="hint" id="draftnote"></span>
  </div>
  <div class="writezone">
    <div class="scale" id="scale"></div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="correctcol"><span class="label">老师批改</span></div>
  </div>

  <div class="tips">
    <div class="th">写话格式小提醒</div>
    <div class="tlist" id="tips"></div>
  </div>
</div>

<script>
  const DATA = /*__DATA__*/ null;
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function fill(){
    const d=DATA, m=d.meta, s=d.sheet;
    document.title='看图写话稿纸 · '+m.topic;
    document.getElementById('kicker').textContent=m.kicker;
    document.getElementById('topic').textContent='· '+m.topic;
    document.getElementById('lead').textContent=s.lead||'';
    document.getElementById('draftnote').textContent=s.draftnote||'';
    const tbox=document.getElementById('tips');
    (s.format_tips||[]).forEach(t=>{
      const div=document.createElement('div'); div.className='t'; div.textContent=t; tbox.appendChild(div);
    });
    // 锚图缺失（src 被注入成空串）→ 直接显占位
    const img=document.getElementById('anchor-img');
    if(!img.getAttribute('src')){ img.style.display='none'; document.getElementById('anchor-ph').style.display='flex'; }
  }

  /* ---------- 格子稿纸（骨架同步写作单一源，勿改逻辑）---------- */
  function buildGrid(){
    const cols=18;
    const sheet=document.querySelector('.sheet');
    const grid=document.getElementById('grid');
    const scale=document.getElementById('scale');
    const gwEl=sheet.querySelector('.gridwrap');
    const cw=gwEl.clientWidth;
    const cellSize=(cw-3)/cols;
    const st=getComputedStyle(sheet);
    const sheetInner=sheet.clientHeight-parseFloat(st.paddingTop)-parseFloat(st.paddingBottom);
    let used=0;
    ['.brandbar','.titlewrap','.namebar','.imgbox','.modhead','.tips'].forEach(sel=>{
      const el=sheet.querySelector(sel); if(el) used+=el.getBoundingClientRect().height;
    });
    used+=110; // 各元素 margin 余量
    const avail=sheetInner-used;
    let rows=Math.max(5, Math.floor(avail/cellSize));

    function renderRows(n){
      grid.innerHTML='';
      for(let i=0;i<cols*n;i++){const c=document.createElement('div');c.className='cell';grid.appendChild(c);}
      scale.innerHTML='';
      const border=1.5;
      const maxHundred=Math.floor(n*cols/100)*100;
      for(let h=100;h<=maxHundred;h+=100){
        let bestRow=Math.round(h/cols);
        if(bestRow<1)bestRow=1; if(bestRow>n)bestRow=n;
        const y=border+bestRow*cellSize;
        const line=document.createElement('div');line.className='tickline';line.style.top=y+'px';
        const tick=document.createElement('div');tick.className='tick';tick.style.top=y+'px';tick.textContent=h+'字';
        scale.appendChild(line);scale.appendChild(tick);
      }
    }
    renderRows(rows);
    const A4_H=1123;
    while(rows>5 && sheet.offsetHeight>A4_H){ rows--; renderRows(rows); }
  }

  window.addEventListener('load',()=>{
    fill();
    setTimeout(()=>{ buildGrid(); document.body.dataset.rendered='1'; },150);
  });
</script>
</body>
</html>
