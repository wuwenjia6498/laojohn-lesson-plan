<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>老约翰 · 同步习作单元海报</title>
<style>
  /* 毛笔标题字：渲染脚本把 Ma Shan Zheng（OFL）子集化后以 data URI 注入，html 自包含 */
  @font-face{
    font-family:"Brush";
    src:url("/*__FONT_BRUSH__*/") format("truetype");
    font-display:block;
  }
  /* 微软雅黑把弯引号画成半角窄字形，让引号码位落到宋体（全角字形），其余文字不受影响 */
  @font-face{
    font-family:"CJK Quotes";
    src:local("SimSun"),local("宋体");
    unicode-range:U+2018-2019,U+201C-201D;
  }
  :root{
    --ink:#4A2C17;          /* 深棕：标题、卡片标题 */
    --ink-soft:#3A2A1E;     /* 正文棕黑 */
    --capsule:#3B2A1B;
    --orange:#F08A3E;
    --cream:#FFF6E3;
    --kraft-a:#EBD3A8;
    --kraft-b:#E0BF8C;
    /* 两处光晕的缺省品牌暖调；渲染脚本按插画取色后由 /*__THEME__*/ 覆盖 */
    --glow-a:rgba(255,226,140,.55);
    --glow-b:rgba(255,236,190,.45);
    --page-w:1242px;
    --font:"CJK Quotes","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","PingFang SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#ffffff;}
  #page{
    width:var(--page-w);
    padding:80px 64px 56px;   /* 顶部留白：logo 放大到 270px 后 52px 显得贴顶（2026-09-21 调） */
    font-family:var(--font);
    color:var(--ink-soft);
    background:
      radial-gradient(ellipse 560px 400px at 8% 4%, var(--glow-a) 0%, transparent 72%),
      radial-gradient(ellipse 720px 320px at 92% 22%, var(--glow-b) 0%, transparent 72%),
      linear-gradient(180deg, #FFF6E3 0%, #FFFBF1 55%, #FFFFFF 100%);
    display:flex; flex-direction:column;
  }

  /* ---- 1. logo ---- */
  /* 品牌资产 logo.png 已换成 1200×414 透明底（2026-09-21），不再需要正片叠底压白底；
     若日后换回白底 png，须把 mix-blend-mode:multiply 加回来，否则奶油背景上会出现白方块 */
  .logo{ width:270px; height:auto; display:block; }

  /* ---- 2. 标题区 ---- */
  .hero{ text-align:center; margin-top:34px; }
  .title{
    font-family:"Brush","Ma Shan Zheng","KaiTi","STKaiti",serif;
    color:var(--ink); line-height:1.12; letter-spacing:.04em;
    font-weight:400;
  }
  .title[data-len="s"]{ font-size:196px; }
  .title[data-len="m"]{ font-size:150px; }
  .title[data-len="l"]{ font-size:118px; letter-spacing:.02em; }
  .subtitle{
    margin-top:18px; font-size:56px; font-weight:900; color:#1A1A1A; letter-spacing:.02em; line-height:1.3;
  }
  .capsule{
    display:inline-block; margin-top:26px;
    background:var(--capsule); color:#fff;
    font-size:36px; font-weight:500; letter-spacing:.06em;
    padding:14px 46px; border-radius:999px; line-height:1.3;
  }

  /* ---- 3. 插画 ---- */
  .illu{
    /* 基准高 920px：容器比图更高时 object-fit:cover 会按高铺满、左右微裁，画面因而更大，
       下缘 140px 让给卡片叠压才不吃亏。单张可用 illustration.zoom 再缩放（JS 覆盖 height）。 */
    position:relative; margin:14px -24px 0; height:920px;
    display:flex; align-items:center; justify-content:center;
  }
  .illu img{
    width:100%; height:100%; object-fit:cover; object-position:center; display:block;
    filter:var(--illu-filter, none);   /* illustration.punch 注入；缺省不处理 */
    /* 双层蒙版：椭圆从中部就开始渐隐 + 四边线性收边，满幅场景图（教室/街景）才化得进奶油底。
       只用单层 radial 时，边缘落在深色墙面或桌椅上会看出一个方块（2026-09-21 实测）。
       收边只吃最外圈：radial 实心到 66%、四边 6–7%，再往里收画面就糊了（0921 用户反馈「虚化太过」后调）。 */
    -webkit-mask-image:
      radial-gradient(ellipse 88% 92% at 50% 50%, #000 66%, rgba(0,0,0,.92) 84%, rgba(0,0,0,0) 100%),
      linear-gradient(to right, rgba(0,0,0,0) 0, #000 7%, #000 93%, rgba(0,0,0,0) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0, #000 6%, #000 95%, rgba(0,0,0,0) 100%);
    -webkit-mask-composite:source-in;
            mask-image:
      radial-gradient(ellipse 88% 92% at 50% 50%, #000 66%, rgba(0,0,0,.92) 84%, rgba(0,0,0,0) 100%),
      linear-gradient(to right, rgba(0,0,0,0) 0, #000 7%, #000 93%, rgba(0,0,0,0) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0, #000 6%, #000 95%, rgba(0,0,0,0) 100%);
            mask-composite:intersect;
  }
  .illu.empty{ height:560px; }

  /* ---- 4. 三张牛皮纸卡 ---- */
  /* 卡片区上提，压住插画下缘约 140px：插画与卡片连成一块，不是上下两段（2026-09-21 改） */
  .cards{ display:flex; gap:26px; align-items:stretch; margin-top:-140px; position:relative; z-index:2; }
  .illu.empty + .cards{ margin-top:4px; }   /* 无图时不重叠，照旧留白 */
  .card{
    flex:1 1 0; min-width:0; position:relative;
    padding:40px 24px 36px; border-radius:16px;
    background:var(--kraft-a);   /* 纯色（2026-09-21 用户定，原牛皮纸斜纹＋渐变已撤） */
    box-shadow:0 14px 32px rgba(74,44,23,.26);
  }
  /* 三层：固定栏目名（63 张统一）→ 本单元标题 → 正文整段 */
  .card .label{
    font-size:23px; font-weight:600; color:#8C6A4A; letter-spacing:.14em;
    line-height:1.2; margin-bottom:12px; white-space:nowrap;
  }
  /* head ≤10 字：字号由 JS 按字数算（可用宽 285px），保证三卡标题都是单行、正文起始线齐平 */
  .card h3{
    font-size:36px; font-weight:800; color:var(--ink); line-height:1.16;
    padding-left:14px; border-left:7px solid var(--ink); letter-spacing:.01em;
    white-space:nowrap;
  }
  .card .body{ margin-top:18px; }
  /* 正文是整段连贯句（不是手工碎行），交给浏览器自动折行 */
  .card .line{ font-size:26px; line-height:1.72; color:var(--ink-soft); font-weight:500; text-align:justify; }
  .card .line + .line{ margin-top:14px; }

  /* ---- 5. 橙色报名条 ---- */
  .cta{
    margin-top:40px; border-radius:30px; padding:36px 40px 38px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    background:linear-gradient(135deg, #F9A257 0%, #F08A3E 58%, #E8782D 100%);
    color:#fff; box-shadow:0 12px 26px rgba(240,138,62,.35);
  }
  .cta .lines{ flex:1 1 0; min-width:0; }
  .cta .fit{ font-size:48px; font-weight:800; line-height:1.3; letter-spacing:.02em; }
  .cta .line{ font-size:36px; font-weight:700; line-height:1.6; letter-spacing:.01em; }
  .cta .sep{ padding:0 8px; font-weight:400; opacity:.85; }
  .qr{ flex:none; width:212px; height:212px; background:#fff; border-radius:16px; padding:12px; }
  .qr img{ width:100%; height:100%; display:block; }

  /* ---- 6. 底部联系方式 ---- */
  .footer{ margin-top:32px; padding-left:8px; font-size:30px; line-height:1.75; color:var(--ink-soft); }
  .footer .k{ letter-spacing:.02em; }

  .hidden{ display:none !important; }
/*__THEME__*/
</style>
</head>
<body>
<div id="page">
  <img class="logo" id="logo" src="/*__LOGO__*/" alt="老约翰深度阅读">

  <div class="hero">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
    <div><span class="capsule" id="capsule"></span></div>
  </div>

  <div class="illu" id="illu"><img id="illu-img" src="/*__ILLU__*/" alt=""></div>

  <div class="cards" id="cards"></div>

  <div class="cta" id="cta">
    <div class="lines">
      <div class="fit" id="cta-fit"></div>
      <div class="line" id="cta-course"></div>
      <div class="line" id="cta-action"></div>
    </div>
    <div class="qr" id="qr-wrap"><img id="qr" src="/*__QR__*/" alt="二维码"></div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
const DATA = /*__DATA__*/ null;

function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function hide(el){ if (el) el.classList.add('hidden'); }
function joinSep(items){
  return items.map(esc).join('<span class="sep">｜</span>');
}
function setText(id, txt){
  const el = document.getElementById(id);
  if (!el) return;
  if (txt) el.textContent = txt; else hide(el);
}

(function init(){
  const d = DATA || {};

  // 标题按字数分档，档位在 CSS 里
  const title = d.title || (d.course && d.course.topic) || '';
  const tEl = document.getElementById('title');
  tEl.textContent = title;
  const n = [...title].length;
  tEl.setAttribute('data-len', n <= 5 ? 's' : (n <= 7 ? 'm' : 'l'));

  setText('subtitle', d.subtitle);
  setText('capsule', d.capsule);

  // 插画：脚本注入为空 ⇒ 去掉 img、留一块奶油空区（缺图属交付前状态，脚本已在 stderr 提示）
  const illuImg = document.getElementById('illu-img');
  // illustration.zoom：按具体画面缩放插画（1 = 基准 920px；主体小、留白多的图调大，满幅场景图调小）
  // illustration.focus：object-position，放大后主体偏出可视区时用（如 "center 38%"）
  const ill = d.illustration || {};
  const zoom = (Number(ill.zoom) > 0) ? Number(ill.zoom) : 1;
  if (zoom !== 1) document.getElementById('illu').style.height = Math.round(920 * zoom) + 'px';
  if (ill.focus) illuImg.style.objectPosition = ill.focus;
  if (!illuImg.getAttribute('src')) {
    illuImg.remove();
    document.getElementById('illu').classList.add('empty');
  }

  // 三张卡（写作痛点·教法 → 能力收获 → 精神滋养）：label 为 63 张固定栏目名；
  // lines 是整段数组（每段自动折行），head 与 lines 皆空则整卡隐藏，其余卡自动等分
  // 卡片标题一律单行：36px 封顶，超 7 字按可用宽 278px 缩到刚好放得下
  function headSize(t){ return Math.min(36, Math.floor(278 / Math.max(1, t.length))); }
  const cardsEl = document.getElementById('cards');
  const html = [];
  (d.cards || []).forEach(function(c){
    if (!c) return;
    const lines = (c.lines || []).filter(Boolean);
    if (!c.head && !lines.length) return;
    html.push('<div class="card">'
            + (c.label ? '<div class="label">'+esc(c.label)+'</div>' : '')
            + (c.head ? '<h3 style="font-size:'+headSize(c.head)+'px">'+esc(c.head)+'</h3>' : '')
            + (lines.length ? '<div class="body">'
                + lines.map(function(t){ return '<div class="line">'+esc(t)+'</div>'; }).join('')
                + '</div>' : '')
            + '</div>');
  });
  if (html.length) cardsEl.innerHTML = html.join(''); else hide(cardsEl);

  // 报名条
  const cta = d.cta || {};
  const campus = d.campus || {};
  setText('cta-fit', cta.fit);
  const course = [cta.sessions, cta.outcome].filter(Boolean);
  const courseEl = document.getElementById('cta-course');
  if (course.length) courseEl.innerHTML = joinSep(course); else hide(courseEl);
  setText('cta-action', campus.cta);
  if (!document.getElementById('qr').getAttribute('src')) hide(document.getElementById('qr-wrap'));

  // 底部：每行缺则隐藏，全空则整块隐藏
  const foot = [];
  if (campus.address) foot.push('<div><span class="k">地址：</span>'+esc(campus.address)+'</div>');
  if (campus.phone)   foot.push('<div><span class="k">电话：</span>'+esc(campus.phone)+'</div>');
  if (campus.note)    foot.push('<div>'+esc(campus.note)+'</div>');
  const footEl = document.getElementById('footer');
  if (foot.length) footEl.innerHTML = foot.join(''); else hide(footEl);

  // 等毛笔体与图片都落位再放行截图（渲染引擎只等 data-rendered + 短暂 settle）
  const waits = [document.fonts.ready];
  try { waits.push(document.fonts.load('160px "Brush"', title || '字')); } catch (e) {}
  Array.from(document.images).forEach(function(im){
    if (im.getAttribute('src') && im.decode) waits.push(im.decode().catch(function(){}));
  });
  Promise.all(waits).catch(function(){}).then(function(){
    document.body.setAttribute('data-rendered', '1');
  });
})();
</script>
</body>
</html>
