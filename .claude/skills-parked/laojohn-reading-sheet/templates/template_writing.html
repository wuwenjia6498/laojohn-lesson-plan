<!DOCTYPE html>
<!-- 写作/写诗页：装饰虚线框 + 横排书写线 + 铅笔图标。学生自由书写用，通常只出单版。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif; color: #2B2B2B;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #page { width: 794px; min-height: 1123px; background: #FFFFFF; position: relative;
    padding: 84px 56px 48px 56px; }
  .brand-logo { position: absolute; top: 40px; right: 48px; height: 56px; width: auto; }
  .variant-tag { position: absolute; top: 64px; left: 56px; font-size: 12px; color: #A89B8A; letter-spacing: 1px; }
  .sheet-title { font-size: 21px; font-weight: 700; color: #2B2B2B; margin: 40px 8px 12px; line-height: 1.5; }
  .sheet-sub { font-size: 14px; color: #8A8175; margin: 0 8px 22px; line-height: 1.6;
    white-space: pre-line; }   /* 副标题内 \n 分行：任务一/任务二这类并列条目分行更清晰 */
  .frame { border: 2px dashed #9BBF84; border-radius: 18px; padding: 30px 34px 26px;
    position: relative; min-height: 800px; }
  .pencil { font-size: 30px; line-height: 1; margin-bottom: 14px; }
  .wline { border-bottom: 1.4px dotted #B9B2A2; height: 48px; position: relative; }
  .wline .pre { position: absolute; left: 2px; bottom: 6px; font-size: 15px; color: #3A4A45; line-height: 1.5; }
</style>
</head>
<body>
<div id="page">
  <img class="brand-logo" id="logo">
  <div class="variant-tag" id="variantTag"></div>
  <div class="sheet-title" id="title"></div>
  <div class="sheet-sub" id="subtitle"></div>
  <div class="frame">
    <div class="pencil" id="pencil">✏️</div>
    <div id="lines"></div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/ null;
function render(){
  const d = DATA;
  document.getElementById('logo').src = d.logo;
  document.getElementById('title').textContent = d.title || '';
  const sub = document.getElementById('subtitle');
  if (d.subtitle) sub.textContent = d.subtitle; else sub.style.display = 'none';
  const tag = document.getElementById('variantTag');
  if (d.variant) tag.textContent = d.variant; else tag.style.display = 'none';
  if (d.icon === false) document.getElementById('pencil').style.display = 'none';

  const wrap = document.getElementById('lines');
  const pre = Array.isArray(d.value) ? d.value : (d.value ? [d.value] : []);
  const n = d.lines || 13;
  for (let i = 0; i < n; i++) {
    const ln = document.createElement('div'); ln.className = 'wline';
    if (pre[i] && pre[i].trim() !== '') {
      const t = document.createElement('div'); t.className = 'pre'; t.textContent = pre[i]; ln.appendChild(t);
    }
    wrap.appendChild(ln);
  }
  document.body.dataset.rendered = '1';
}
render();
</script>
</body>
</html>
