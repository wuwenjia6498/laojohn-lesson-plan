const SVGNS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
// PPT 导出标注：给「示范答案」加 data-answer/data-order，不影响打印外观。
let __AO = 0;
function mark(e){ e.setAttribute('data-answer','1'); e.setAttribute('data-order', __AO++); return e; }
// 阶数自适应：坐标按 steps 数量在版面内均分（支持 2–6+ 阶，左下→右上）
const PALETTE=["#D9883A","#A8504F","#5B7FA6","#C49B3E","#4E8C7D","#8268A0"];
const X_LEFT=72, X_TOP_MAX=392, Y_BOTTOM=815, Y_TOP=170, LINE_LEN=358, LINE_GAP=58;
function buildSteps(n){
  const rise = n>1 ? (Y_BOTTOM - Y_TOP)/(n-1) : 0;
  const run  = n>1 ? (X_TOP_MAX - X_LEFT)/(n-1) : 0;
  const STEPS=[];
  for(let i=0;i<n;i++){
    STEPS.push({X: Math.round(X_LEFT+run*i), Y: Math.round(Y_BOTTOM-rise*i),
                color: PALETTE[i % PALETTE.length]});
  }
  return {STEPS, RUN: run, RISE: rise};
}

// 智能折行：连续字母/数字(含 . - – 连接)视为不可拆 token，决不从中间断；
// 并做避头尾——闭标点不落行首、开标点不落行尾。max=每行单位数(汉字记 1，字母数字串记其长度)。
function wrap(s, max){
  s = String(s);
  const NO_HEAD = "，。、；：？！）】」』”’》%…—-";   // 不能在行首
  const NO_TAIL = "（【「『“‘《";                       // 不能在行尾
  const toks = s.match(/[A-Za-z0-9]+(?:[.\-–][A-Za-z0-9]+)*|[\s\S]/g) || [];
  const lines = []; let cur = "";
  for (const tk of toks){
    if (tk === "\n"){ lines.push(cur); cur = ""; continue; }
    if (cur !== "" && cur.length + tk.length > max && NO_HEAD.indexOf(tk) === -1){
      let carry = "";
      while (cur && NO_TAIL.indexOf(cur[cur.length - 1]) !== -1){ carry = cur[cur.length - 1] + carry; cur = cur.slice(0, -1); }
      lines.push(cur); cur = carry + tk;
    } else { cur += tk; }
  }
  if (cur !== "") lines.push(cur);
  return lines;
}

function render(){
  __AO = 0;
  const d=DATA;
  document.getElementById('logo').src=d.logo;
  document.getElementById('title').textContent=d.title||'';
  const sub=document.getElementById('subtitle'); if(d.subtitle) sub.textContent=d.subtitle; else sub.style.display='none';
  const tag=document.getElementById('variantTag'); if(d.variant) tag.textContent=d.variant; else tag.style.display='none';
  const foot=document.getElementById('foot'); if(d.footer) foot.textContent=d.footer; else foot.style.display='none';

  const svg=document.getElementById('svg');
  const steps=d.steps||[];
  const n=steps.length;
  const {STEPS, RUN, RISE} = buildSteps(n);

  // 楼梯折线（浅灰）
  const pts=[];
  pts.push([22, STEPS[0].Y]);
  for(let i=0;i<n;i++){
    const s=STEPS[i];
    pts.push([s.X, s.Y]);
    pts.push([s.X, s.Y-RISE]);
    pts.push([s.X+RUN, s.Y-RISE]);
  }
  let dstr="M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
  svg.appendChild(el("path",{d:dstr,fill:"none",stroke:"#CBC4B6","stroke-width":2,"stroke-linejoin":"miter"}));
  const top=STEPS[n-1];
  svg.appendChild(el("polygon",{points:`${top.X+RUN},${top.Y-RISE-14} ${top.X+RUN-7},${top.Y-RISE} ${top.X+RUN+7},${top.Y-RISE}`,fill:"#9A937F"}));

  steps.forEach((st,i)=>{
    const s=STEPS[i];
    const lx=s.X+18, ly=s.Y;
    svg.appendChild(el("line",{x1:lx-6,y1:ly-38,x2:lx-6,y2:ly-14,stroke:s.color,"stroke-width":4,"stroke-linecap":"round"}));
    const hd=el("text",{x:lx+4,y:ly-21,class:"hd",fill:s.color}); hd.textContent=st.header||''; svg.appendChild(hd);
    const items=st.items||["",""];
    let rowY=ly+6;
    items.slice(0,2).forEach(it=>{
      if(it && it.trim()!==''){
        const g=mark(el("g",{}));
        const lines=wrap(String(it), 24);
        lines.forEach((ln,li)=>{
          const t=el("text",{x:lx+6,y:rowY+li*22-4,class:"ftxt"}); t.textContent=ln; g.appendChild(t);
        });
        g.appendChild(el("line",{x1:lx+2,y1:rowY+lines.length*22,x2:lx+2+LINE_LEN,y2:rowY+lines.length*22,stroke:"#D8D2C5","stroke-width":1.3}));
        svg.appendChild(g);
        rowY += Math.max(2,lines.length)*22 + 16;
      } else {
        svg.appendChild(el("line",{x1:lx+2,y1:rowY,x2:lx+2+LINE_LEN,y2:rowY,stroke:s.color,"stroke-width":1.4,"stroke-opacity":0.55}));
        rowY += LINE_GAP;
      }
    });
  });
  document.body.dataset.rendered='1';
}
render();
</script>
