<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>国庆后宣讲分享海报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F9614A;
    --card:#FEDFDC;
    --teal:#22C3B8;
    --ink:#2B2B2B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--coral)}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;position:relative;overflow:hidden}

  /* 下半浅色区：斜向光带 */
  .lower{position:absolute;left:0;right:0;bottom:0;height:640px;
    background:
      linear-gradient(115deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 22%, rgba(255,255,255,0) 34%),
      linear-gradient(115deg, rgba(255,255,255,0) 48%, rgba(255,255,255,.5) 60%, rgba(255,255,255,0) 72%),
      linear-gradient(160deg, #F7D3D6 0%, #FBE4DF 45%, #F9C9B8 100%);}
  /* 红色区域的下弧边 */
  .arc{position:absolute;left:-260px;right:-260px;top:1090px;height:420px;
    background:var(--coral);border-radius:0 0 50% 50% / 0 0 100% 100%;
    box-shadow:0 14px 0 0 rgba(255,255,255,.55)}

  .tag{position:absolute;left:0;top:128px;width:318px;height:118px;background:#fff;
    border-radius:0 59px 59px 0;display:flex;flex-direction:column;justify-content:center;padding-left:110px;
    color:var(--coral);font-weight:700;line-height:1.12}
  .tag .s{font-size:38px}
  .tag .b{font-size:50px}
  .logo{position:absolute;right:72px;top:120px;width:384px}

  .card{position:absolute;left:66px;right:66px;top:332px;height:994px;background:var(--card);
    border:4px solid #fff;border-radius:30px}
  .title{font-family:"Ma Shan Zheng","KaiTi",sans-serif;color:var(--coral);font-size:156px;line-height:1.02;
    font-style:normal;letter-spacing:-8px}
  .title .l1{position:absolute;left:62px;top:56px}
  .title .l2{position:absolute;right:66px;top:206px}
  .title .hl{color:var(--teal)}
  .sub{position:absolute;left:40px;right:30px;top:400px;color:var(--coral);font-size:40px;font-weight:700;
    letter-spacing:.5px;white-space:nowrap}
  .points{position:absolute;left:114px;right:50px;top:470px;color:#4A4A4A;font-size:34px;line-height:52px;font-weight:700;letter-spacing:2.5px}
  .points .h{margin-bottom:2px}
  .points ol{list-style:none}
  .points li{padding-left:58px;text-indent:-58px}
  .time{position:absolute;left:118px;right:118px;top:744px;height:84px;border-radius:42px;background:var(--teal);
    border:4px solid #fff;color:#fff;font-size:40px;font-style:italic;font-weight:500;display:flex;align-items:center;padding-left:34px;letter-spacing:0;white-space:nowrap}
  .speaker{position:absolute;left:0;right:0;top:862px;text-align:center;color:#3a3a3a;font-size:40px}

  .qr{position:absolute;left:444px;top:1563px;width:192px;height:192px;border-radius:50%;overflow:hidden;
    background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .qr img{width:100%;height:100%;display:block;object-fit:contain;padding:6px;background:#fff}
  .qrtip{position:absolute;left:0;right:0;top:1768px;text-align:center;font-size:30px;color:#222;
    text-shadow:0 0 6px #fff,0 0 6px #fff}
</style>
</head>
<body>
  <div class="lower"></div>
  <div class="arc"></div>

  <div class="tag"><span class="s">线上直播</span><span class="b">邀请函</span></div>
  <img class="logo" src="海报素材/logo-白.png" alt="老约翰深度阅读">

  <div class="card">
    <div class="title">
      <div class="l1"><span class="hl">读写</span>并重</div>
      <div class="l2">正当其时</div>
    </div>
    <div class="sub">——新教材之下，读书会与同步写作双线并进</div>
    <div class="points">
      <div class="h">分享亮点：</div>
      <ol>
        <li>1、新课标、新教材下的小学语文市场变化。</li>
        <li>2、同步写作课程正式发布及课程介绍。</li>
        <li>3、总部后续产品开发规划与自媒体运营思路。</li>
      </ol>
    </div>
    <div class="time">分享时间：10月13日(星期二)&nbsp;14:00</div>
    <div class="speaker">分享人：俞富良 总经理</div>
  </div>

  <div class="qr"><img src="海报素材/直播二维码.png" alt="直播二维码"></div>
  <div class="qrtip">识别上方二维码，进入内部直播间</div>
</body>
</html>
