<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>国庆后宣讲直播封面</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--coral:#F9614A;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:750px;height:422px;background:var(--coral)}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;position:relative;overflow:hidden;color:#fff}

  .tag{position:absolute;left:0;top:30px;width:138px;height:66px;background:#fff;border-radius:0 33px 33px 0;
    display:flex;flex-direction:column;justify-content:center;padding-left:28px;color:var(--coral);
    font-size:19px;font-weight:700;line-height:1.3}
  .logo{position:absolute;right:34px;top:26px;width:190px}

  .pill{position:absolute;right:-40px;top:132px;height:84px;width:fit-content;background:#fff;border-radius:42px 0 0 42px;
    display:flex;align-items:center;padding:0 82px 0 44px;color:var(--coral);font-family:"Ma Shan Zheng","KaiTi",serif;font-size:66px;font-weight:400;letter-spacing:-7px;padding-top:6px}
  .sub{position:absolute;right:42px;top:240px;font-size:24px;font-weight:500;letter-spacing:.5px}
  .time{position:absolute;right:42px;top:306px;font-size:20px;font-style:italic;letter-spacing:.5px;text-align:right}
  .speaker{position:absolute;right:42px;top:340px;font-size:20px;font-style:italic;letter-spacing:.5px;text-align:right}
</style>
</head>
<body>
  <div class="tag"><span>线上直播</span><span>邀请函</span></div>
  <img class="logo" src="海报素材/logo-白.png" alt="老约翰深度阅读">

  <div class="pill"><span style="color:#22C3B8">读写</span>并重，正当其时</div>
  <div class="sub">——新教材之下，读书会与同步写作双线并进</div>
  <div class="time">分享时间：10月13日（星期二）14:00</div>
  <div class="speaker">分享人：俞富良 总经理</div>
</body>
</html>
